<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Astari Dental Care — Konsep Website</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Konsep website oleh Maxi Growth Studio. Bukan website resmi klinik.">
<meta property="og:title" content="Astari Dental Care — Konsep Website">
<meta property="og:description" content="Konsep website oleh Maxi Growth Studio. Bukan website resmi klinik.">
<meta name="theme-color" content="#7a1048">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* TOKENS — brand Astari: magenta #e33088 (situs asli), blush #f9d3e0, emas logo, abu #6b7280 */
:root{--navy:#7a1048;--navy2:#5c0b36;--ink:#2b0a1c;--cy:#e33088;--cy-t:#b0155f;--cy-d:#ff9cc8;--sky:#f08ab9;--ice:#fde8f1;--ice2:#fff4f9;--bg:#fffafc;--line:#f0d5e2;--line2:#e2b6cc;--muted:#6b5560;--muted2:#8d7f88;
--ok:#1b8a4c;--warn:#b7791f;--bad:#c2410c;--wa:#0f8a4a;--gold:#d4a017;--ease:cubic-bezier(.22,1,.36,1);--r:26px 26px 26px 8px;--r-s:16px 16px 16px 5px;
--sh1:0 1px 2px rgba(122,16,72,.06),0 8px 24px -12px rgba(122,16,72,.18);--sh2:0 2px 4px rgba(122,16,72,.05),0 30px 60px -30px rgba(122,16,72,.35);
--hf:Fraunces,Georgia,"Times New Roman",serif;--bf:Figtree,"Segoe UI",system-ui,Arial,sans-serif;--mf:"DM Mono",ui-monospace,Menlo,monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{font-family:var(--bf);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--cy);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--hf);line-height:1.15;letter-spacing:-.02em;font-weight:700;color:var(--navy)}
h2{font-size:clamp(28px,3.6vw,44px);text-wrap:balance}
.wrap{width:min(1200px,100%);margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
section{padding:clamp(64px,8vw,112px) 0}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lead{font-size:17px;color:var(--muted);max-width:560px}
.chk{display:inline-block;font-family:var(--mf);font-size:10.5px;font-weight:700;color:var(--warn);background:#fff6e5;border:1px dashed #e4b867;border-radius:6px;padding:1px 6px;margin-left:4px;letter-spacing:0;white-space:nowrap;vertical-align:middle;line-height:1.5}
.nw{white-space:nowrap}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* section head: nomor stasiun + judul (tanpa pill) */
.shd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:16px 48px;align-items:end;margin-bottom:34px}
.stn{display:flex;align-items:center;gap:10px;font-family:var(--mf);font-size:12px;color:var(--cy-t);font-weight:700;letter-spacing:.04em;margin-bottom:12px;text-transform:uppercase}
.stn b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--cy);color:var(--navy);font-size:12px;background:#fff}
.stn::after{content:"";height:2px;width:46px;background:repeating-linear-gradient(90deg,var(--cy) 0 8px,transparent 8px 14px)}
@media(max-width:899px){.shd{grid-template-columns:1fr;margin-bottom:24px}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .2s var(--ease),background .2s,box-shadow .2s,border-color .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-navy{background:var(--navy);color:#fff;box-shadow:0 10px 24px -12px rgba(122,16,72,.7)}
.btn-navy:hover{background:var(--navy2)}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 10px 24px -12px rgba(15,138,74,.8)}
.btn-wa:hover{background:#0c7a41}
.btn-gh{border:1.5px solid var(--line2);background:#fff;color:var(--navy)}
.btn-gh:hover{border-color:var(--navy)}
.btn-sm{min-height:44px;padding:0 16px;font-size:14px}
.wai{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;margin-left:-10px}
/* ============ PREVIEW BAR ============ */
.pv{background:var(--ink);color:#f3dfe9;font-size:13px;line-height:1.45}
.pv-in{display:flex;align-items:center;gap:10px;min-height:44px;padding-top:6px;padding-bottom:6px}
.pv-t{flex:1;min-width:0}.pv-t b{color:#fff}
.pv .chk{background:transparent;color:#ffd58a;border-color:#8f7a4a}
.pv-x{width:44px;height:44px;display:grid;place-items:center;color:#fff;flex:none;margin-right:-10px}
/* ============ NAV ============ */
nav{position:sticky;top:0;z-index:50;background:rgba(255,250,252,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
nav.sc{border-color:var(--line);box-shadow:0 6px 20px -16px rgba(122,16,72,.4)}
.nav-in{display:flex;align-items:center;gap:20px;min-height:70px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{height:40px;width:auto}
.brand .city{font-family:var(--mf);font-size:10.5px;font-weight:700;color:var(--cy-t);border-left:1.5px solid var(--line2);padding-left:10px;line-height:1.3;letter-spacing:.06em}
.links{display:flex;gap:4px;margin-left:auto}
.links a{padding:10px 12px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--muted);transition:color .2s,background .2s}
.links a:hover,.links a[aria-current=true]{color:var(--navy);background:var(--ice)}
.nav-r{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.lang button{min-width:40px;min-height:36px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--muted);font-family:var(--mf)}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
.burger{display:none;width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;flex-direction:column;align-items:center;justify-content:center}
.burger i{display:block;width:18px;height:2px;background:var(--navy);border-radius:2px;transition:transform .3s var(--ease)}
.burger i+i{margin-top:5px}
.burger[aria-expanded=true] i:first-child{transform:translateY(3.5px) rotate(45deg)}.burger[aria-expanded=true] i+i{transform:translateY(-3.5px) rotate(-45deg);margin-top:0}
.sheet{display:none}
.scrim{position:fixed;inset:0;background:rgba(43,10,28,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
@media(max-width:1060px){.links,.nav-cta{display:none}.burger{display:flex}
 .sheet{display:block;position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px 18px;transform:translateY(-8px);opacity:0;visibility:hidden;transition:opacity .25s,transform .3s var(--ease),visibility .3s;box-shadow:0 20px 40px -20px rgba(122,16,72,.35)}
 .sheet.open{opacity:1;transform:none;visibility:visible}
 .sheet a.sl{display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px solid var(--line);font-family:var(--hf);font-weight:600;font-size:17px;color:var(--navy)}
 .sheet a.sl small{font-family:var(--mf);font-size:11px;color:var(--cy-t)}
 .srow{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap}}
@media(max-width:600px){.nav-r .lang{display:none}.brand svg{height:34px}.nav-in{min-height:62px}}
/* ============ HERO ============ */
.hero{padding:clamp(24px,4.4vw,60px) 0 clamp(40px,5vw,70px);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-8%;top:-30%;width:62%;aspect-ratio:1;border-radius:50%;border:2px dashed rgba(227,48,136,.25);pointer-events:none}
.hg{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:center;position:relative}
.hl0{display:flex;align-items:center;gap:8px;font-family:var(--mf);font-size:12.5px;font-weight:700;color:var(--cy-t);margin-bottom:16px;letter-spacing:.03em;flex-wrap:wrap}
.hl0 span{display:inline-flex;align-items:center;gap:6px}
.hl0 span+span::before{content:"";width:16px;height:2px;background:var(--cy);border-radius:1px}
.hero h1{font-size:clamp(38px,5vw,66px);letter-spacing:-.035em;line-height:1.04;margin-bottom:20px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--cy-t);position:relative;white-space:nowrap}
.hero h1 em svg{position:absolute;left:-2%;right:0;bottom:-.14em;width:104%;height:.3em}
.hero .lead{font-size:18px}
.today{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;margin-top:26px;max-width:540px;box-shadow:var(--sh1)}
.today-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--mf);font-size:11px;font-weight:700;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.brs{display:grid;gap:2px}
.brs a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:44px;border-radius:12px;padding:0 6px;margin:0 -6px;transition:background .2s}
.brs a:hover{background:var(--ice2)}
.brs .no{width:28px;height:28px;border-radius:50%;border:2px solid var(--cy);display:grid;place-items:center;font-family:var(--mf);font-size:11px;font-weight:700;color:var(--navy)}
.brs .nm{font-weight:700;font-size:14.5px;min-width:0}
.brs .st{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--muted);text-align:right}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.st-open .dot{animation:pl 2s infinite}
.st-closed .dot{background:var(--muted2)}.st-unk .dot{background:#fff;border:2px dashed var(--warn)}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(27,138,76,.45)}70%{box-shadow:0 0 0 8px rgba(27,138,76,0)}100%{box-shadow:0 0 0 0 rgba(27,138,76,0)}}
.intent{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.intent span{font-size:12.5px;color:var(--muted);font-weight:700;width:100%;margin-bottom:2px}
.intent button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-size:13.5px;font-weight:700;color:var(--navy);transition:all .15s}
.intent button:hover{border-color:var(--navy)}
.intent button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.btn-pri{min-height:58px;padding:0 26px 0 12px}
.btn-pri .bl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.btn-pri small{font-size:12px;font-weight:600;opacity:.8}
#hctal{transition:opacity .2s}
.stage{position:relative;aspect-ratio:1;width:100%;max-width:520px;justify-self:center}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;z-index:2}
.halo{position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle at 40% 36%,#fff 0,var(--ice) 58%,rgba(253,232,241,0) 72%)}
.orbit{position:absolute;inset:3%;border-radius:50%;border:1.5px solid rgba(227,48,136,.4);animation:spin 70s linear infinite}
.orbit::before{content:"";position:absolute;inset:8%;border-radius:50%;border:1px dashed rgba(122,16,72,.14)}
.orbit i{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:3px solid var(--cy)}
.orbit i:nth-child(1){left:50%;top:0}.orbit i:nth-child(2){left:6.7%;top:75%;border-color:var(--navy)}.orbit i:nth-child(3){left:93.3%;top:75%}
@keyframes spin{to{transform:rotate(360deg)}}
.fb{position:absolute;inset:20%;display:none;z-index:1;animation:float 6s ease-in-out 1s infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.badge{position:absolute;left:3%;bottom:7%;width:92px;height:92px;border-radius:50%;background:#fff;box-shadow:0 18px 36px -18px rgba(122,16,72,.5);outline:1.5px solid rgba(227,48,136,.6);outline-offset:4px;z-index:3;padding:8px}
.zap{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);z-index:4;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;box-shadow:var(--sh1);display:none}
.zap.on{display:block}.zap b{color:var(--navy);font-family:var(--mf)}
.zap.pop b{animation:pop .4s var(--ease)}@keyframes pop{50%{transform:scale(1.5);color:var(--cy-t)}}
.proof{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-top:clamp(28px,4vw,52px);overflow:hidden;box-shadow:var(--sh1)}
.pf{display:flex;gap:14px;padding:20px;align-items:flex-start;transition:background .2s}
.pf+.pf{border-left:1px solid var(--line)}
.pf:hover{background:var(--ice2)}
.pf .ic{width:42px;height:42px;border-radius:14px 14px 14px 4px;background:var(--ice);color:var(--navy);display:grid;place-items:center;flex:none}
.pf b{display:block;font-family:var(--hf);font-size:15.5px;color:var(--navy);line-height:1.25}
.pf span.s{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:3px}
@media(max-width:1179px){.proof{grid-template-columns:repeat(2,minmax(0,1fr))}.pf:nth-child(3){border-left:0}.pf:nth-child(n+3){border-top:1px solid var(--line)}}
@media(max-width:899px){.hg{grid-template-columns:minmax(0,1fr);gap:0}.hero h1{font-size:clamp(34px,9.6vw,46px)}.hero .lead{font-size:16px}
 .ctas{flex-direction:column}.ctas .btn{width:100%}.btn-pri{justify-content:center}
 .stage{width:78%;max-width:320px;margin-top:26px}.badge{width:62px;height:62px;padding:5px}
 .pf{flex-direction:column;gap:10px;padding:14px}.pf .ic{width:34px;height:34px}}
/* ============ CEK GIGI ============ */
#cek{background:linear-gradient(180deg,var(--bg),#fff 40%)}
.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ps{text-align:left;padding:8px 0 4px;min-height:44px;display:block;width:100%}
.ps i{display:block;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.ps i::after{content:"";position:absolute;inset:0;background:var(--navy);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease),background .3s}
.ps.on i::after{transform:scaleX(1)}.ps.done i::after{transform:scaleX(1);background:var(--cy)}
.ps span{display:flex;gap:8px;align-items:baseline;margin-top:10px;font-size:13.5px;color:var(--muted2);font-weight:600;white-space:nowrap}
.ps b{font-family:var(--mf);font-size:11px}
.ps.on span,.ps.done span{color:var(--navy);font-weight:800}
.ps em{font-style:normal}
.console{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);background:#fff;border:1px solid var(--line);border-radius:30px 30px 30px 10px;box-shadow:var(--sh2);margin-top:14px}
.c-l{padding:clamp(20px,3vw,34px);border-right:1px solid var(--line)}
.c-l-in{position:sticky;top:96px}
.c-r{padding:clamp(20px,3vw,34px);min-width:0}
.step{font-family:var(--mf);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cy-t)}
.ptitle{font-size:clamp(20px,2vw,24px);margin:6px 0 16px}
.c-head{display:flex;align-items:flex-end;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--ice2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:14px}
.seg button{min-height:38px;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(122,16,72,.18)}
.aw{position:relative;border-radius:22px;background:radial-gradient(ellipse at 50% 50%,var(--ice2) 0,#fff 70%)}
.arch{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none;overflow:visible;touch-action:manipulation}
.arch .t{cursor:pointer;outline:none}.arch .hit{fill:transparent}
.arch .tb{transform-box:fill-box;transform-origin:center;transition:transform .3s var(--ease)}
.arch .body{fill:url(#toothG);stroke:#d9a8c0;stroke-width:1.1;transition:fill .25s,stroke .25s}
.arch .gr{fill:none;stroke:#e5bfd2;stroke-width:1;stroke-linecap:round}
.arch .halo2{fill:none;stroke:var(--cy);stroke-width:1.4;opacity:0;transform:scale(.6);transform-box:fill-box;transform-origin:center;transition:opacity .3s,transform .3s var(--ease)}
.arch .t:hover .tb,.arch .t:focus-visible .tb{transform:scale(1.07)}
.arch .t:hover .body{stroke:var(--cy)}
.arch .t:focus-visible .halo2{opacity:1;transform:none;stroke-dasharray:3 2}
.arch .t.on .body{fill:var(--navy);stroke:var(--navy)}.arch .t.on .gr{stroke:var(--cy)}.arch .t.on .halo2{opacity:1;transform:none}
.arch.pre .tb{transform:scale(0)}
.arch .nb{opacity:0;transition:opacity .2s;pointer-events:none}.arch .nb.on{opacity:1}
.arch .nb circle{fill:var(--cy);stroke:#fff;stroke-width:1.2}
.arch .nb text{fill:var(--ink);font-family:var(--mf);font-size:7px;font-weight:700}
.arch text.jl{font-family:var(--mf);font-size:8.5px;fill:var(--muted2);font-weight:700;letter-spacing:.2em}
.arch.zu,.arch.zl{overflow:hidden}
.arch.zu .t[data-jaw="1"],.arch.zl .t[data-jaw="0"],.arch.zu .nb[data-jaw="1"],.arch.zl .nb[data-jaw="0"]{visibility:hidden}
.side{position:absolute;bottom:2px;font-family:var(--mf);font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 8px;white-space:nowrap;pointer-events:none}
.side.r{left:0}.side.l{right:0}
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:52%;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.aw.zm .ctr{position:static;transform:none;width:auto;padding:14px 0 0}
.ctr .big{font-family:var(--hf);font-weight:700;font-size:clamp(30px,3.6vw,40px);line-height:1;color:var(--navy)}
.ctr .sm{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35;text-wrap:balance}
.tapme{width:44px;height:44px;margin:0 auto 8px;border-radius:50%;border:2px solid var(--cy);display:grid;place-items:center;position:relative;color:var(--cy-t)}
.tapme::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--cy);animation:ring 2.2s var(--ease) infinite}
@keyframes ring{to{transform:scale(1.6);opacity:0}}
.skip{pointer-events:auto;margin-top:6px;font-size:12.5px;font-weight:800;color:var(--cy-t);min-height:40px;text-decoration:underline;text-underline-offset:4px}
.mchips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
.mchip{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;background:var(--ice);color:var(--navy);border-radius:99px;padding:0 0 0 9px;pointer-events:auto;line-height:1.2}
.mchip button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--cy-t)}
.mchip.plus{padding:6px 9px}
.clr{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1.5px solid var(--line2);border-radius:99px;font-size:12.5px;font-weight:800;margin-top:10px;pointer-events:auto;background:#fff;color:var(--navy)}
.clr .i{width:14px;height:14px}

  '<div class="lbtns"><a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="'+wa(t("w_br")+b.n+t("w_br2"))+'">'+ic("wa")+'WhatsApp</a><a class="btn btn-gh btn-sm" target="_blank" rel="noopener" href="'+mapsUrl(b)+'">Google Maps ↗</a><a class="btn btn-gh btn-sm" target="_blank" rel="noopener" href="'+wazeUrl(b)+'">Waze ↗</a></div>';
 const cp=$("#cpa");if(cp)cp.onclick=()=>copyText(b.a,()=>gtoast(t("copied_a")));
 $("#fbr").innerHTML=BR.map(b=>'<li><a href="#lokasi" data-b="'+b.k+'">'+b.n+'</a></li>').join("");$$("#fbr a").forEach(a=>a.onclick=()=>{LB=a.dataset.b;buildLoc();if(mapOn)loadMap()})}
function loadMap(){mapOn=true;const b=BR.find(x=>x.k===LB);$("#map").innerHTML='<iframe loading="lazy" title="Google Maps — Astari Dental Care '+b.n+'" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q='+encodeURIComponent(b.q)+'&z=16&output=embed"></iframe>'}

/* ================= POLESAN: reveal, progress, ripple, glow ================= */
(function(){const bar=$("#sbar");
 if(bar)addEventListener("scroll",()=>{const m=document.documentElement.scrollHeight-innerHeight;bar.style.transform="scaleX("+(m>0?Math.min(1,scrollY/m):0)+")"},{passive:true});
 const T0=[".shd",".proof",".console",".sv",".ptab",".pside",".dc",".fc",".pbox",".mapc",".lg",".fq>div",".close"];
 if("IntersectionObserver" in window&&!RM){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px",threshold:.08});
  T0.forEach(s=>$$(s).forEach((e,i)=>{e.classList.add("rv");e.style.transitionDelay=Math.min(i%4,3)*70+"ms";io.observe(e)}))}
 document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn");if(!b||RM)return;const r=b.getBoundingClientRect(),s=document.createElement("span");s.className="rip";const d=Math.max(r.width,r.height)*2;s.style.cssText="width:"+d+"px;height:"+d+"px;left:"+(e.clientX-r.left-d/2)+"px;top:"+(e.clientY-r.top-d/2)+"px";b.appendChild(s);setTimeout(()=>s.remove(),650)});
 document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".sv,.fc,.dc");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")},{passive:true})})();

<script>
/* ================= HERO 3D — gigi Astari + cincin nama + emblem logo + bakteri (Three.js r128, lazy) ================= */
addEventListener("load",()=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";s.onload=init3d;s.onerror=()=>{document.getElementById("fb").style.display="block"};document.head.appendChild(s)});
function init3d(){
 const stage=document.getElementById("stage");let R;
 try{R=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){document.getElementById("fb").style.display="block";return}
 R.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(R.domElement);document.getElementById("zap").classList.add("on");
 const badge=stage.querySelector(".badge");if(badge)badge.style.display="none";
 const cv=R.domElement;cv.style.touchAction="pan-y";cv.style.cursor="grab";
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,.1,100);cam.position.set(0,.15,9.4);
 const TAU=Math.PI*2,v=new THREE.Vector3(),rnd=(a,b)=>a+Math.random()*(b-a);
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 const NAVY=0x132573,CY=0x16c2e0;

 /* tooth */
 const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.28,metalness:.04});
 const tooth=new THREE.Group();
 const cg=new THREE.SphereGeometry(1.2,56,40),p=cg.attributes.position;
 for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);v.x*=1.08;v.z*=.9;
  if(v.y>0){const r=Math.hypot(v.x,v.z),th=Math.atan2(v.z,v.x);v.y=v.y*.72+.12*Math.cos(2*th)*(r/1.2)-.22*Math.max(0,1-r/.6)}else v.y*=.6;p.setXYZ(i,v.x,v.y,v.z)}
 cg.computeVertexNormals();const crown=new THREE.Mesh(cg,mat);crown.position.y=.55;tooth.add(crown);
 [-1,1].forEach(sd=>{const rg=new THREE.CylinderGeometry(.46,.16,1.9,32,6);const rp=rg.attributes.position;for(let i=0;i<rp.count;i++){v.fromBufferAttribute(rp,i);const k=(v.y+.95)/1.9;v.x+=sd*(1-k)*.12;rp.setXYZ(i,v.x,v.y,v.z)}rg.computeVertexNormals();
  const m=new THREE.Mesh(rg,mat);m.position.set(sd*.5,-.7,0);m.rotation.z=sd*.08;tooth.add(m)});
 // cyan glint (the white stroke in the logo, turned into a highlight arc)
 const gl=new THREE.Mesh(new THREE.TorusGeometry(.72,.05,10,40,1.4),new THREE.MeshBasicMaterial({color:CY}));gl.position.set(-.18,.95,.98);gl.rotation.set(-.35,.1,1.7);tooth.add(gl);
 tooth.rotation.set(.2,-.4,0);tooth.scale.setScalar(1.05);sc.add(tooth);

 /* text ring + orbiting emblem */
 const RING=2.0,SHIELD=2.08;
 const ring=new THREE.Group();ring.rotation.set(.32,0,-.14);sc.add(ring);
 function bandTexture(){const c=document.createElement("canvas");c.width=2048;c.height=96;const x=c.getContext("2d");
  x.font="600 42px Fraunces, 'Segoe UI', Arial, sans-serif";x.fillStyle="#7a1048";x.textBaseline="middle";
  const unit="ASTARI DENTAL CARE   ●   DAGO · PANGHEGAR · CIMAHI · KOPO · MARGACINTA   ●   ";
  const w=x.measureText(unit).width,n=Math.max(1,Math.round(c.width/w)),sx=c.width/(w*n);
  x.save();x.scale(sx,1);for(let i=0;i<n;i++)x.fillText(unit,i*w,c.height/2+2);x.restore();
  x.fillStyle="#e33088";x.fillRect(0,4,c.width,4);x.fillRect(0,c.height-8,c.width,4);
  const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;t.anisotropy=4;return t}
 const bandGeo=new THREE.CylinderGeometry(RING,RING,.3,160,1,true);
 const bandFront=new THREE.MeshBasicMaterial({transparent:true,side:THREE.FrontSide,depthWrite:false});
 const bandBack=new THREE.MeshBasicMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,opacity:.22});
 ring.add(new THREE.Mesh(bandGeo,bandBack),new THREE.Mesh(bandGeo,bandFront));
 const setBand=()=>{const t=bandTexture();bandFront.map=t;bandBack.map=t;bandFront.needsUpdate=bandBack.needsUpdate=true};
 setBand();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(setBand);
 const EMB='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="#fff"/><circle cx="100" cy="100" r="88" fill="none" stroke="#d4a017" stroke-width="7"/><g transform="translate(50 26) scale(1)"><path d="M52 24C40 8 10 10 10 40c0 20 12 40 28 56 4-22 16-38 52-48" fill="none" stroke="#e33088" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 24C62 12 86 14 88 34c0 6-4 10-8 12" fill="none" stroke="#e33088" stroke-width="6" stroke-linecap="round"/><path d="M27 68A27 27 0 0 1 66 33Z" fill="#d4a017"/></g><text x="100" y="152" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="800" font-size="30" fill="#b3820a">Astari</text></svg>';
 const logoImg=new Image(),logoTex=new THREE.Texture(logoImg);
 logoImg.onload=()=>{const c=document.createElement("canvas");c.width=c.height=512;c.getContext("2d").drawImage(logoImg,0,0,512,512);logoTex.image=c;logoTex.needsUpdate=true};
 logoImg.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(EMB);
 const emblem=new THREE.Sprite(new THREE.SpriteMaterial({map:logoTex,transparent:true}));emblem.scale.set(.95,.95,1);ring.add(emblem);
 const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(SHIELD,2),new THREE.MeshBasicMaterial({color:CY,wireframe:true,transparent:true,opacity:.05,depthWrite:false}));sc.add(shell);
 const ripples=[],rippleGeo=new THREE.RingGeometry(.12,.17,40);let flash=0;
 function ripple(pt){const m=new THREE.Mesh(rippleGeo,new THREE.MeshBasicMaterial({color:CY,transparent:true,opacity:.9,side:THREE.DoubleSide,depthWrite:false}));
  m.position.copy(pt).setLength(SHIELD);m.lookAt(pt.clone().multiplyScalar(2));m.userData.t=0;sc.add(m);ripples.push(m);flash=1}

 /* bacteria — varied shapes */
 const ink=new THREE.MeshStandardMaterial({color:NAVY,roughness:.45,metalness:.1});
 const cyan=new THREE.MeshStandardMaterial({color:CY,roughness:.35,metalness:.2});
 const ball=(r,m)=>new THREE.Mesh(new THREE.IcosahedronGeometry(r,2),m);
 const tube=(pts,r,m,seg)=>new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),seg||40,r,6,false),m);
 const MAKERS=[
  m=>{const g=new THREE.Group();g.add(ball(.17,m));for(let i=0;i<8;i++){const a=i/8*TAU,s=ball(.03,cyan);s.position.set(Math.cos(a)*.19,Math.sin(a)*.19,0);g.add(s)}return g},
  m=>{const g=new THREE.Group();[-.11,.11].forEach(x=>{const b=ball(.12,m);b.position.x=x;b.scale.set(.9,1.05,1);g.add(b)});return g},
  m=>{const g=new THREE.Group();for(let i=0;i<5;i++){const b=ball(.085,m);b.position.set(i*.16-.32,Math.sin(i*1.1)*.07,0);g.add(b)}return g},
  m=>{const g=new THREE.Group();[[0,0,0],[.13,.05,0],[-.12,.07,.04],[.02,.15,-.05],[.07,-.12,.05],[-.08,-.1,-.04],[.14,-.03,-.08]].forEach(q=>{const b=ball(.075,m);b.position.set(...q);g.add(b)});return g},
  m=>{const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.32,12),m);body.rotation.z=Math.PI/2;g.add(body);[-.16,.16].forEach(x=>{const c=ball(.08,m);c.position.x=x;g.add(c)});
   const pts=[];for(let i=0;i<=12;i++)pts.push(new THREE.Vector3(.22+i*.045,Math.sin(i*1.1)*.05,0));g.add(tube(pts,.012,cyan,30));return g},
  m=>{const pts=[];for(let i=0;i<=40;i++){const t=i/40;pts.push(new THREE.Vector3((t-.5)*.7,Math.cos(t*TAU*2.5)*.08,Math.sin(t*TAU*2.5)*.08))}return tube(pts,.035,m,80)},
  m=>{const g=new THREE.Group();const pts=[];for(let i=0;i<=10;i++){const a=-.9+i*.18;pts.push(new THREE.Vector3(Math.cos(a)*.22,Math.sin(a)*.22,0))}g.add(tube(pts,.06,m,24));
   const f=[];for(let i=0;i<=10;i++)f.push(new THREE.Vector3(.14+i*.03,-.2-i*.035,Math.sin(i)*.03));g.add(tube(f,.01,cyan,20));return g}];
 const bugs=[];
 function spawn(b,first){const a=rnd(0,TAU),r=first?rnd(2.6,3.1):3.4;b.position.set(Math.cos(a)*r,rnd(-1.5,1.6),Math.sin(a)*r*.45);
  b.userData.v=new THREE.Vector3(-b.position.x,-b.position.y*.5,-b.position.z).setLength(rnd(.25,.45));b.userData.spin=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1));b.userData.dead=0;b.visible=true;b.scale.setScalar(first?1:.01);b.userData.grow=first?1:0}
 const N=innerWidth<700?7:10;
 for(let i=0;i<N;i++){const b=MAKERS[i%MAKERS.length](i%4===3?cyan:ink);b.traverse(o=>{if(o.isMesh)o.userData.bug=b});sc.add(b);bugs.push(b);spawn(b,true)}
 const bits=[],bitGeo=new THREE.TetrahedronGeometry(.045);
 function burst(pt){for(let i=0;i<10;i++){const m=new THREE.Mesh(bitGeo,i%2?cyan:ink);m.position.copy(pt);m.userData.v=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).setLength(rnd(1.2,2.4));m.userData.t=0;sc.add(m);bits.push(m)}}

 sc.add(new THREE.HemisphereLight(0xffffff,0xf3d0e0,.95));
 const k=new THREE.DirectionalLight(0xffffff,.85);k.position.set(3,4,5);sc.add(k);
 const c2=new THREE.PointLight(CY,1,14);c2.position.set(-3,-1,3);sc.add(c2);
 function size(){const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}size();addEventListener("resize",size);

 let mx=0,my=0,vis=true,drag=null,yaw=0,vy=0,cleared=0;
 const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),zap=document.getElementById("zapc");
 function hit(e){const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,cam);
  const h=ray.intersectObjects(bugs.filter(b=>b.visible&&!b.userData.dead),true)[0];return h&&h.object.userData.bug}
 addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
 cv.addEventListener("pointermove",e=>{if(drag){const dx=e.clientX-drag.x;drag.moved+=Math.abs(dx);vy=dx*.012;yaw+=vy;drag.x=e.clientX;return}cv.style.cursor=hit(e)?"pointer":"grab"});
 cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,moved:0};cv.style.cursor="grabbing"});
 cv.addEventListener("pointercancel",()=>{drag=null;cv.style.cursor="grab"});
 addEventListener("pointerup",e=>{if(!drag)return;const d=drag;drag=null;cv.style.cursor="grab";
  if(d.moved<6&&e.target===cv){const b=hit(e);if(b){b.userData.dead=1;burst(b.getWorldPosition(new THREE.Vector3()));b.visible=false;cleared++;if(zap){zap.textContent=cleared;zap.parentNode.classList.remove("pop");void zap.offsetWidth;zap.parentNode.classList.add("pop")}
   setTimeout(()=>spawn(b,false),1600)}}});
 new IntersectionObserver(([e])=>vis=e.isIntersecting).observe(stage);

 const clk=new THREE.Clock();let emA=0;
 (function loop(){requestAnimationFrame(loop);if(!vis)return;const dt=Math.min(clk.getDelta(),.05),tt=clk.elapsedTime,s=Math.min(scrollY/600,1.2);
  if(!reduce){
   if(!drag){yaw+=vy;vy*=.94}
   tooth.rotation.y+=((-.4+tt*.3+s*2.4+mx*.8+yaw)-tooth.rotation.y)*.08;tooth.rotation.x+=((.2+my*.5)-tooth.rotation.x)*.06;tooth.position.y=Math.sin(tt*1.1)*.1;
   ring.rotation.y-=dt*.35;emA+=dt*.55;
   if(bandFront.map)bandFront.map.offset.x=(bandFront.map.offset.x+dt*.01)%1;
   emblem.position.set(Math.cos(emA)*(RING+.02),0,Math.sin(emA)*(RING+.02));
   const inFront=emblem.getWorldPosition(v).z>0;emblem.material.opacity+=((inFront?1:.35)-emblem.material.opacity)*.15;
   shell.rotation.y+=dt*.05;
   bugs.forEach(b=>{if(b.userData.dead&&!b.visible)return;const u=b.userData;
    if(u.grow<1){u.grow=Math.min(1,u.grow+dt*1.5);b.scale.setScalar(Math.max(.01,u.grow))}
    if(u.cool>0)u.cool-=dt;v.copy(b.position).negate().setLength(.09*dt);u.v.add(v);u.v.x+=Math.sin(tt*1.3+b.id)*.004;u.v.y+=Math.cos(tt*1.1+b.id)*.004;
    u.v.clampLength(.12,.55);b.position.addScaledVector(u.v,dt);
    const d=b.position.length();
    if(d<SHIELD+.18){const n=b.position.clone().normalize();u.v.reflect(n).addScaledVector(n,.35);b.position.copy(n.multiplyScalar(SHIELD+.2));if(!(u.cool>0)){ripple(b.position.clone());u.cool=1.6}}
    if(d>3.8)spawn(b,false);
    b.rotation.x+=u.spin.x*dt;b.rotation.y+=u.spin.y*dt;b.rotation.z+=u.spin.z*dt});
  }else{emblem.position.set(0,0,RING+.02)}
  for(let i=ripples.length-1;i>=0;i--){const m=ripples[i];m.userData.t+=dt;const q=m.userData.t/.8;m.scale.setScalar(1+q*4);m.material.opacity=.9*(1-q);if(q>=1){sc.remove(m);m.material.dispose();ripples.splice(i,1)}}
  for(let i=bits.length-1;i>=0;i--){const m=bits[i];m.userData.t+=dt;m.position.addScaledVector(m.userData.v,dt);m.userData.v.multiplyScalar(.93);m.rotation.x+=.2;m.scale.setScalar(Math.max(.01,1-m.userData.t/.9));if(m.userData.t>.9){sc.remove(m);bits.splice(i,1)}}
  flash*=.9;shell.material.opacity=.05+flash*.1;
  R.render(sc,cam)})();
}
