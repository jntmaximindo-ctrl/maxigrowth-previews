<style>
:root{--ink:#173e46;--ink2:#0f2d33;--muted:#4f6a70;--muted2:#7d9296;--line:#dcebea;--line2:#c6dddc;--bg:#f5fbfa;--paper:#fffdfd;--card:#fff;
--mg:#eb087f;--mg-d:#c4066a;--mg-l:#fce8f2;--tl:#2cb5b8;--tl-d:#126a75;--tl-l:#e3f5f5;--ok:#1b8a52;--warn:#b86a12;--bad:#c0392b;--wa:#25d366;
--sh1:0 1px 2px rgba(23,62,70,.05),0 16px 36px -24px rgba(23,62,70,.35);--sh2:0 40px 70px -40px rgba(23,62,70,.4);
--ease:cubic-bezier(.22,.8,.25,1);--r-card:22px 22px 44px 44px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:74px;-webkit-text-size-adjust:100%}
body{font-family:Karla,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:16.5px}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
:focus-visible{outline:2.5px solid var(--mg);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4,.nun{font-family:Nunito,"Arial Rounded MT Bold",system-ui,sans-serif;letter-spacing:-.01em;line-height:1.08}
.wrap{width:min(1160px,100% - 32px);margin-inline:auto}
section{padding:clamp(70px,9vw,118px) 0;position:relative}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hand{font-family:Caveat,"Segoe Print","Comic Sans MS",cursive;font-weight:700;color:var(--mg-d);font-size:1.35em;line-height:1}
/* section heading: number bubble + title, no pill eyebrow */
.shd{display:grid;gap:14px 48px;align-items:end;margin-bottom:34px}
@media(min-width:900px){.shd{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}}
.shd .no{display:inline-flex;align-items:center;gap:10px;font-family:Nunito,sans-serif;font-weight:900;font-size:14px;color:var(--tl-d)}
.shd .no b{width:34px;height:34px;border-radius:50% 50% 50% 8px;background:var(--tl);color:#fff;display:grid;place-items:center;font-size:14px}
h2{font-size:clamp(30px,4.4vw,52px);font-weight:900;letter-spacing:-.025em;margin-top:12px;text-wrap:balance}
h2 .hl{color:var(--mg-d)}
.lead{color:var(--muted);font-size:clamp(16px,1.35vw,18px);max-width:560px;text-wrap:pretty}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border-radius:16px;font-weight:800;font-size:15.5px;line-height:1.2;white-space:nowrap;font-family:Nunito,sans-serif;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .2s,color .2s,border-color .2s}
.btn:active{transform:scale(.98)}
.btn-mg{background:var(--mg-d);color:#fff;box-shadow:0 4px 0 #8f004c}
.btn-mg:hover{transform:translateY(-2px);box-shadow:0 6px 0 #8f004c}
.btn-ol{border:2px solid var(--line2);color:var(--ink);background:#fff}
.btn-ol:hover{border-color:var(--tl-d)}
.btn-wa{background:var(--wa);color:#06260f;box-shadow:0 4px 0 #139044}
.btn-wa:hover{transform:translateY(-2px)}
.btn-ink{background:var(--ink);color:#fff;box-shadow:0 4px 0 #07191c}
.btn .ar{width:16px;height:16px;transition:transform .25s var(--ease)}.btn:hover .ar{transform:translateX(4px)}
.chk{display:inline-block;font-family:Karla,sans-serif;font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;font-style:normal;color:#7a5a12;background:#fff4d6;border:1px dashed #d9b35a;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap;line-height:1.5}
.lnk{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14.5px;color:var(--tl-d);min-height:44px;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:rgba(44,181,184,.5);text-underline-offset:5px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}.rv.in{opacity:1;transform:none}
/* smile divider — the teal "bowl" from the logo */
.smile{display:block;width:100%;height:46px;color:var(--tl-l)}
/* preview banner */
.pv{background:var(--ink2);color:#d6e7e8;font-size:13px;position:relative;z-index:60}
.pv-in{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 0}
.pv-t{flex:1;min-width:0;line-height:1.45}.pv-t b{color:#fff}
.pv .chk{margin:0}
.pv-x{width:44px;height:44px;display:grid;place-items:center;color:#fff;flex:none;border-radius:12px}
.pv-x:hover{background:rgba(255,255,255,.08)}
/* nav */
nav{position:sticky;top:0;z-index:50;background:rgba(245,251,250,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
nav.sc{border-color:var(--line)}
.nav-in{display:flex;align-items:center;gap:18px;min-height:70px}
.brand{display:flex;align-items:center;flex:none}.brand img{height:44px;width:auto}
.links{display:flex;gap:4px;margin-left:auto}
.links a{padding:10px 12px;border-radius:12px;font-weight:700;font-size:15px;color:var(--muted);transition:color .2s,background .2s}
.links a:hover,.links a[aria-current]{color:var(--ink);background:var(--tl-l)}
.nav-r{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:3px}
.lang button{min-width:40px;min-height:38px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.nav-cta{min-height:46px;padding:0 16px}
.burger{display:none;width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;position:relative}
.burger i{position:absolute;left:13px;right:13px;height:2px;background:var(--ink);border-radius:2px;transition:transform .3s var(--ease)}
.burger i:first-child{top:17px}.burger i:last-child{top:26px}
.burger[aria-expanded=true] i:first-child{transform:translateY(4.5px) rotate(45deg)}.burger[aria-expanded=true] i:last-child{transform:translateY(-4.5px) rotate(-45deg)}
.sheet{position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px 18px;display:none;box-shadow:var(--sh2)}
.sheet.open{display:block}
.sheet a.sl{display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px solid var(--line);font-family:Nunito,sans-serif;font-weight:800;font-size:18px}
.sheet a.sl small{color:var(--tl-d);font-size:12px}
.srow{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
@media(max-width:1020px){.links{display:none}.burger{display:block}.nav-r{margin-left:auto}}
@media(max-width:560px){.nav-cta,.nav-r>.lang{display:none}.brand img{height:38px}}
/* hero */
.hero{padding:clamp(28px,5vw,64px) 0 26px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-8%;top:8%;width:min(620px,70vw);aspect-ratio:1;border-radius:50%;border:2px dashed rgba(44,181,184,.28);pointer-events:none}
.hg{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(20px,4vw,56px);align-items:center}
@media(max-width:899px){.hg{grid-template-columns:minmax(0,1fr)}}
.hey{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:18px 18px 18px 4px;padding:8px 14px 8px 10px;font-weight:700;font-size:14.5px;box-shadow:var(--sh1)}
.hey svg{width:22px;height:22px;flex:none}
.hero h1{font-size:clamp(38px,5.4vw,66px);font-weight:900;letter-spacing:-.035em;margin:18px 0 16px;text-wrap:balance}
.hero h1 .mg{color:var(--mg-d)}
.hero h1 .ul{background:linear-gradient(transparent 68%,rgba(44,181,184,.28) 68%)}
.hero .lead{font-size:clamp(16.5px,1.5vw,19px)}
.now{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:22px 0 24px;font-weight:700;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(27,138,82,.5);animation:pulse 2s infinite;flex:none}
.dot.off{background:#9aa9ab;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(27,138,82,0)}100%{box-shadow:0 0 0 0 rgba(27,138,82,0)}}
.now .st{display:inline-flex;align-items:center;gap:9px}
.now .sub{color:var(--muted);font-weight:500}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.ctas .btn-mg{min-height:56px;padding:0 22px 0 12px}
.wai{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.bl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}.bl small{font-family:Karla,sans-serif;font-weight:600;font-size:12.5px;opacity:.85}
/* 3D stage */
.stage{position:relative;aspect-ratio:1/1;max-width:560px;width:100%;margin-inline:auto}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;z-index:2}
.stage .disc{position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle at 50% 42%,#fff 0,#eaf7f7 55%,#d5efef 100%);box-shadow:inset 0 -18px 40px rgba(18,106,117,.08)}
.stage .bowl{position:absolute;left:18%;right:18%;bottom:11%;height:22%;border-radius:0 0 999px 999px;background:rgba(44,181,184,.14)}
.fb{position:absolute;inset:14%;width:72%;height:72%;z-index:1}
.stage.live .fb{display:none}
.zap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:3;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:7px 14px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:var(--sh1);display:none}
.stage.live .zap{display:block}
.zap b{color:var(--mg-d);font-family:Nunito,sans-serif;font-size:15px}
.zap.pop b{animation:pop .4s var(--ease)}@keyframes pop{50%{transform:scale(1.5)}}
.heart{position:absolute;right:12%;top:8%;width:46px;z-index:3;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(8deg)}}
/* proof bar */
.proof{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:34px}
@media(max-width:899px){.proof{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pf{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-card);padding:16px 16px 20px;display:flex;flex-direction:column;gap:2px;min-height:96px;transition:border-color .2s,transform .2s var(--ease)}
.pf:hover{border-color:var(--tl);transform:translateY(-2px)}
.pf b{font-family:Nunito,sans-serif;font-weight:900;font-size:clamp(20px,2.2vw,26px);color:var(--ink)}
.pf span{font-size:14px;color:var(--muted);line-height:1.35}
.pf .star{color:#e0a100}

@media(max-width:899px){.hero::before{display:none}}
.pv-s{display:none}@media(max-width:640px){.pv-l{display:none}.pv-s{display:inline}}
.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:40px}
.ps{text-align:left;padding:8px 0 4px;min-height:44px;display:block;width:100%}
.ps i{display:block;height:3px;border-radius:2px;background:#dcebea;position:relative;overflow:hidden}
.ps i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease),background .3s}
.ps.on i::after{transform:scaleX(1)}.ps.done i::after{transform:scaleX(1);background:var(--mg)}
.ps span{display:flex;gap:8px;align-items:baseline;margin-top:10px;font-size:13.5px;color:#5f7a7f;font-weight:500;white-space:nowrap}
.ps b{font-family:Nunito,sans-serif;font-size:11px;letter-spacing:.12em;font-weight:700}
.ps.on span{color:var(--ink);font-weight:700}.ps.done span{color:var(--ink)}.ps.done b{color:var(--tl-d)}
.ps em{font-style:normal}
.console{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--sh2);margin-top:14px}
.c-l{padding:clamp(20px,3vw,36px);border-right:1px solid var(--line)}
.c-l-in{position:sticky;top:92px}
.c-r{padding:clamp(20px,3vw,36px);min-width:0}
.step{font-family:Nunito,sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--tl-d)}
.ptitle{font-family:Nunito,sans-serif;font-weight:700;font-size:clamp(20px,2vw,24px);margin:6px 0 16px;letter-spacing:-.02em}
.c-head{display:flex;align-items:flex-end;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.c-head .ptitle{margin-bottom:14px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:14px}
.seg button{min-height:34px;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--muted);transition:background .2s,color .2s,box-shadow .2s}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.aw{position:relative;border-radius:20px;background:radial-gradient(ellipse at 50% 50%,#f2fafa 0,#fff 70%)}
.arch{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none;overflow:visible;touch-action:manipulation}
.arch .t{cursor:pointer;outline:none}
.arch .hit{fill:transparent}
.arch .tb{transform-box:fill-box;transform-origin:center;transition:transform .3s var(--ease)}
.arch .body{fill:url(#toothG);stroke:#9fbcbd;stroke-width:1.1;transition:fill .25s,stroke .25s}
.arch .gr{fill:none;stroke:#b8d0d0;stroke-width:1;stroke-linecap:round;transition:stroke .25s}
.arch .halo{fill:none;stroke:var(--mg);stroke-width:1.3;opacity:0;transform:scale(.6);transform-box:fill-box;transform-origin:center;transition:opacity .3s,transform .3s var(--ease)}
.arch .t:hover .tb,.arch .t:focus-visible .tb{transform:scale(1.06)}
.arch .t:hover .body{stroke:var(--mg);stroke-width:1.4}
.arch .t:focus-visible .halo{opacity:1;transform:none;stroke-dasharray:3 2;stroke-width:1.6}
.arch .t.on .body{fill:var(--ink);stroke:var(--ink)}
.arch .t.on .gr{stroke:#7fe0e2}
.arch .t.on .halo{opacity:1;transform:none}
.arch.pre .tb{transform:scale(0)}
.arch .nb{opacity:0;transition:opacity .2s;pointer-events:none}.arch .nb.on{opacity:1}
.arch .nb circle{fill:var(--mg);stroke:#fff;stroke-width:1.2}
.arch .nb text{fill:#fff;font-family:Nunito,sans-serif;font-size:7.5px;font-weight:720}
.arch text.jl{font-family:Nunito,sans-serif;font-size:8.5px;fill:#9a978f;font-weight:700;letter-spacing:.24em}
.arch.zu,.arch.zl{overflow:hidden}
.arch.zu .t[data-jaw="1"],.arch.zl .t[data-jaw="0"],.arch.zu .nb[data-jaw="1"],.arch.zl .nb[data-jaw="0"]{visibility:hidden}
.side{position:absolute;bottom:2px;font-family:Nunito,sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 8px;white-space:nowrap;pointer-events:none;line-height:1.4}
.side.r{left:0}.side.l{right:0}
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:52%;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.aw.zm .ctr{position:static;transform:none;width:auto;padding:14px 0 0}
.ctr .big{font-family:Nunito,sans-serif;font-weight:720;font-size:clamp(30px,3.6vw,40px);line-height:1;letter-spacing:-.03em}
.ctr .sm{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35;text-wrap:balance}
.tapme{width:44px;height:44px;margin:0 auto 8px;border-radius:50%;border:1.5px solid var(--mg);display:grid;place-items:center;position:relative;color:var(--tl-d)}
.tapme::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid var(--mg);animation:ring 2.2s var(--ease) infinite}
@keyframes ring{to{transform:scale(1.6);opacity:0}}
.skip{pointer-events:auto;margin-top:6px;font-size:12px;font-weight:700;color:var(--tl-d);min-height:36px;text-decoration:underline;text-underline-offset:4px}
.mchips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
.mchip{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:600;background:var(--tl-l);color:var(--ink);border-radius:99px;padding:0 0 0 9px;pointer-events:auto;line-height:1}
.mchip button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--tl-d)}
.mchip.plus{padding:5px 9px}
.clr{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border:1px solid var(--line2);border-radius:99px;font-size:12px;font-weight:700;margin-top:10px;pointer-events:auto;background:#fff;transition:border-color .2s}
.clr:hover{border-color:var(--ink)}.clr .i{width:14px;height:14px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .15s;z-index:3}
.tip.on{opacity:1}
.toast{position:absolute;left:50%;top:6px;transform:translate(-50%,-4px);background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;opacity:0;transition:opacity .25s,transform .25s var(--ease);pointer-events:none;white-space:nowrap;z-index:3}
.toast.on{opacity:1;transform:translate(-50%,0)}
.orient{font-size:12px;color:var(--muted);margin-top:12px;text-align:center;text-wrap:balance;line-height:1.45}
.kl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:28px}
@media(min-width:1100px){.kl{grid-template-columns:repeat(4,minmax(0,1fr))}}

<script id="mg-mapfix">
/* Maxi Growth · map fallback: di pratinjau (artifact) iframe Google Maps diblokir, jadi diganti kartu peta statis.
   Di domain asli (maxigrowthstudio.com / *.pages.dev / domain klinik) skrip ini tidak melakukan apa-apa. */
(function(){
  var H=location.hostname||"";
  if(/(^|\.)maxigrowthstudio\.com$|\.pages\.dev$/.test(H)) return;
  var RX=/(maps\.google\.[a-z.]+\/maps|google\.[a-z.]+\/maps)/;
  function en(){return (document.documentElement.lang||"").toLowerCase().indexOf("en")===0}
  function bg(){
    var s='<svg class="mgbg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+
    '<rect width="400" height="300" fill="var(--bg,#f2f4f6)"/>'+
    '<g fill="var(--line,#dfe4e8)" opacity=".9"><rect x="18" y="20" width="96" height="70" rx="6"/><rect x="132" y="20" width="120" height="44" rx="6"/><rect x="270" y="20" width="112" height="84" rx="6"/><rect x="18" y="108" width="70" height="92" rx="6"/><rect x="104" y="82" width="148" height="60" rx="6"/><rect x="270" y="122" width="112" height="58" rx="6"/><rect x="104" y="160" width="88" height="70" rx="6"/><rect x="208" y="160" width="44" height="70" rx="6"/><rect x="18" y="218" width="70" height="64" rx="6"/><rect x="270" y="198" width="112" height="84" rx="6"/></g>'+
    '<path d="M-10 250 C 80 230, 120 280, 210 262 S 330 230, 410 246" fill="none" stroke="var(--ink,#1d2a33)" stroke-opacity=".08" stroke-width="14"/>'+
    '<g stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".95"><path d="M0 100 H400"/><path d="M96 0 V300"/><path d="M260 0 V300"/><path d="M0 150 H260"/></g>'+
    '<g transform="translate(200 150)"><circle r="26" fill="var(--gold,var(--cy,var(--ink,#1d2a33)))" opacity=".18"/>'+
    '<path d="M0 12 C -14 -4 -16 -8 -16 -16 A16 16 0 1 1 16 -16 C16 -8 14 -4 0 12 Z" fill="var(--gold,var(--cy,var(--ink,#1d2a33)))" stroke="#fff" stroke-width="2.5"/>'+
    '<circle cy="-16" r="6" fill="#fff"/></g></svg>';
    return s;
  }
  function card(f){
    if(f.dataset.mgDone)return; var src=f.getAttribute("src")||""; if(!RX.test(src))return;
    f.dataset.mgDone=1;
    if(f.parentNode&&f.parentNode.querySelector(":scope > .mgmap")){f.remove();return}
    var q=""; try{q=new URL(src,location.href).searchParams.get("q")||""}catch(e){}
    var name=(f.getAttribute("title")||"").replace(/^(Google Maps|Peta|Map)\s*[—–-]?\s*/i,"").trim()||q.split(",")[0];
    var href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q||name);
    var d=document.createElement("div"); d.className="mgmap"; d.setAttribute("role","group");
    d.setAttribute("aria-label",(en()?"Map of ":"Peta ")+name);
    d.innerHTML='<div class="mgviz">'+bg()+'<div class="mgnote">'+(en()?"Interactive map appears on the live site":"Peta interaktif tampil di website asli")+'</div></div>'+
      '<div class="mgcard"><div class="mgtx"><b></b><small></small></div><a class="mgbtn" target="_blank" rel="noopener"></a></div>';
    d.querySelector("b").textContent=name; d.querySelector("small").textContent=q&&q!==name?q:"";
    var a=d.querySelector("a"); a.href=href; a.textContent=(en()?"Open in Google Maps":"Buka di Google Maps")+" ↗";
    var pr=f.parentNode; f.replaceWith(d);
    if(pr&&pr.style){pr.style.height="auto";pr.style.aspectRatio="auto";pr.style.minHeight="0";pr.style.padding="0";pr.style.display="block"}
  }
  function scan(n){
    if(!n||n.nodeType!==1)return;
    if(n.tagName==="IFRAME")card(n); else n.querySelectorAll&&n.querySelectorAll("iframe").forEach(card);
    if(n.querySelectorAll&&document.readyState!=="loading")n.querySelectorAll("#mapb,#mapBtn,#lmap").forEach(function(b){if(b.tagName==="BUTTON"&&!b.dataset.mgClick){b.dataset.mgClick=1;setTimeout(function(){try{b.click()}catch(e){}},0)}});
  }
  new MutationObserver(function(ms){ms.forEach(function(m){
    if(m.type==="attributes")card(m.target); else m.addedNodes.forEach(scan);
  })}).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["src"]});
  function boot(){
    scan(document.body);
    /* tombol "Muat peta" di pratinjau langsung dipicu, supaya kartu peta tampil tanpa klik */
    ["#mapb","#mapBtn","#lmap"].forEach(function(s){var b=document.querySelector(s);if(b&&b.tagName==="BUTTON")try{b.click()}catch(e){}});
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(boot,60)});else setTimeout(boot,60);
})();
</script>

function init3d(){

  cg.computeVertexNormals();addFaceted(cg,new THREE.Vector3(0,.6,0));
  [-1,1].forEach(sd=>{const rg=new THREE.ConeGeometry(.45,1.9,24,4,false);rg.rotateX(Math.PI);addFaceted(rg,new THREE.Vector3(sd*.47,-.65,0),sd*.12)});
  {const bw=new THREE.Mesh(new THREE.SphereGeometry(.62,32,16,0,Math.PI*2,Math.PI/2,Math.PI/2),new THREE.MeshStandardMaterial({color:0x2cb5b8,roughness:.4}));bw.scale.set(1,.7,.35);bw.position.set(0,.78,1.02);tooth.add(bw)}
  tooth.rotation.set(.2,-.4,0);tooth.scale.setScalar(1.08);sc.add(tooth);

  /* ---------- Atabara shield: text ring + orbiting logo emblem ---------- */
  const RING=2.0,SHIELD=2.08;
  const ring=new THREE.Group();ring.rotation.set(.32,0,-.14);sc.add(ring);
  function bandTexture(){
    const c=document.createElement("canvas");c.width=2048;c.height=96;const x=c.getContext("2d");
    x.font="900 44px Nunito, 'Arial Rounded MT Bold', Arial, sans-serif";x.fillStyle="#173e46";x.textBaseline="middle";
    const unit="TAMI DENTAL CARE   ♥   #BIKINHEPI   ♥   HEI TAMI   ♥   ";
    const w=x.measureText(unit).width,n=Math.max(1,Math.round(c.width/w)),sx=c.width/(w*n);
    x.save();x.scale(sx,1);for(let i=0;i<n;i++)x.fillText(unit,i*w,c.height/2+2);x.restore();
    x.fillStyle="#2cb5b8";x.fillRect(0,4,c.width,4);x.fillRect(0,c.height-8,c.width,4);
    const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;t.anisotropy=4;return t}
  const bandGeo=new THREE.CylinderGeometry(RING,RING,.3,160,1,true);
  const bandFront=new THREE.MeshBasicMaterial({transparent:true,side:THREE.FrontSide,depthWrite:false});
  const bandBack=new THREE.MeshBasicMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,opacity:.22});
  const bandF=new THREE.Mesh(bandGeo,bandFront),bandB=new THREE.Mesh(bandGeo,bandBack);ring.add(bandB,bandF);
  const setBand=()=>{const t=bandTexture();bandFront.map=t;bandBack.map=t;bandFront.needsUpdate=bandBack.needsUpdate=true};
  setBand();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(setBand);
  // logo emblem riding the ring
  const logoImg=new Image(),logoTex=new THREE.Texture(logoImg);
  logoImg.onload=()=>{const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");x.fillStyle="#fff";x.beginPath();x.arc(256,256,250,0,Math.PI*2);x.fill();x.lineWidth=14;x.strokeStyle="#eb087f";x.stroke();x.drawImage(logoImg,86,86,340,340);logoTex.image=c;logoTex.needsUpdate=true};
  logoImg.src=document.getElementById("lmark").src;
  const emblem=new THREE.Sprite(new THREE.SpriteMaterial({map:logoTex,transparent:true}));emblem.scale.set(.95,.95,1);ring.add(emblem);
  // faint protective shell + ripples where bacteria are stopped
  const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(SHIELD,1),new THREE.MeshBasicMaterial({color:0x2cb5b8,wireframe:true,transparent:true,opacity:.035,depthWrite:false}));sc.add(shell);
  const ripples=[];const rippleGeo=new THREE.RingGeometry(.12,.17,40);
  function ripple(pt){const m=new THREE.Mesh(rippleGeo,new THREE.MeshBasicMaterial({color:0xeb087f,transparent:true,opacity:.9,side:THREE.DoubleSide,depthWrite:false}));
    m.position.copy(pt).setLength(SHIELD);m.lookAt(pt.clone().multiplyScalar(2));m.userData.t=0;sc.add(m);ripples.push(m);flash=1}
  let flash=0;

  /* ---------- bacteria ---------- */
  const ink=new THREE.MeshStandardMaterial({color:0x126a75,roughness:.45,metalness:.1,flatShading:true});
  const gold=new THREE.MeshStandardMaterial({color:0xeb087f,roughness:.35,metalness:.15,flatShading:true});
  const ball=(r,m)=>new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),m);
  const tube=(pts,r,m,seg)=>new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),seg||40,r,5,false),m);
  const MAKERS=[
    m=>{const g=new THREE.Group();g.add(ball(.17,m));for(let i=0;i<8;i++){const a=i/8*TAU,s=ball(.03,gold);s.position.set(Math.cos(a)*.19,Math.sin(a)*.19,0);g.add(s)}return g}, // coccus with pili
    m=>{const g=new THREE.Group();[-.11,.11].forEach(x=>{const b=ball(.12,m);b.position.x=x;b.scale.set(.9,1.05,1);g.add(b)});return g}, // diplococcus
    m=>{const g=new THREE.Group();for(let i=0;i<5;i++){const b=ball(.085,m);b.position.set(i*.16-.32,Math.sin(i*1.1)*.07,0);g.add(b)}return g}, // streptococcus chain
    m=>{const g=new THREE.Group();[[0,0,0],[.13,.05,0],[-.12,.07,.04],[.02,.15,-.05],[.07,-.12,.05],[-.08,-.1,-.04],[.14,-.03,-.08]].forEach(q=>{const b=ball(.075,m);b.position.set(...q);g.add(b)});return g}, // staphylococcus
    m=>{const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.32,8),m);body.rotation.z=Math.PI/2;g.add(body);[-.16,.16].forEach(x=>{const c=ball(.08,m);c.position.x=x;g.add(c)});
      const pts=[];for(let i=0;i<=12;i++)pts.push(new THREE.Vector3(.22+i*.045,Math.sin(i*1.1)*.05,0));g.add(tube(pts,.012,gold,30));return g}, // bacillus + flagellum
    m=>{const pts=[];for(let i=0;i<=40;i++){const t=i/40;pts.push(new THREE.Vector3((t-.5)*.7,Math.cos(t*TAU*2.5)*.08,Math.sin(t*TAU*2.5)*.08))}return tube(pts,.035,m,80)}, // spirillum
    m=>{const g=new THREE.Group();const pts=[];for(let i=0;i<=10;i++){const a=-.9+i*.18;pts.push(new THREE.Vector3(Math.cos(a)*.22,Math.sin(a)*.22,0))}g.add(tube(pts,.06,m,24));
      const f=[];for(let i=0;i<=10;i++)f.push(new THREE.Vector3(.14+i*.03,-.2-i*.035,Math.sin(i)*.03));g.add(tube(f,.01,gold,20));return g} // vibrio
  ];
  const bugs=[];
  function spawn(b,first){const a=rnd(0,TAU),r=first?rnd(2.6,3.1):3.4;b.position.set(Math.cos(a)*r,rnd(-1.5,1.6),Math.sin(a)*r*.45);
    b.userData.v=new THREE.Vector3(-b.position.x,-b.position.y*.5,-b.position.z).setLength(rnd(.25,.45));b.userData.spin=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1));b.userData.dead=0;b.visible=true;b.scale.setScalar(first?1:.01);b.userData.grow=first?1:0}
  const N=innerWidth<700?7:10;
  for(let i=0;i<N;i++){const b=MAKERS[i%MAKERS.length](i%4===3?gold:ink);b.traverse(o=>{if(o.isMesh)o.userData.bug=b});sc.add(b);bugs.push(b);spawn(b,true)}
  // debris from a cleared bacterium
  const bits=[];const bitGeo=new THREE.TetrahedronGeometry(.045);
  function burst(pt){for(let i=0;i<10;i++){const m=new THREE.Mesh(bitGeo,i%2?gold:ink);m.position.copy(pt);m.userData.v=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).setLength(rnd(1.2,2.4));m.userData.t=0;sc.add(m);bits.push(m)}}

  /* ---------- lights ---------- */
  sc.add(new THREE.HemisphereLight(0xffffff,0xcfe9ea,.95));
  const k=new THREE.DirectionalLight(0xffffff,.9);k.position.set(3,4,5);sc.add(k);
  const g2=new THREE.PointLight(0xeb087f,.6,14);g2.position.set(-3,-1,3);sc.add(g2);
  function size(){const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}size();addEventListener("resize",size);

  /* ---------- interaction: drag to spin, tap bacteria to clear ---------- */
  let mx=0,my=0,vis=true,drag=null,yaw=0,pitch=0,vy=0,cleared=0;
  const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
  const zap=document.getElementById("zapc");
  function hit(e){const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,cam);
    const h=ray.intersectObjects(bugs.filter(b=>b.visible&&!b.userData.dead),true)[0];return h&&h.object.userData.bug}
  addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
  cv.addEventListener("pointermove",e=>{if(drag){const dx=e.clientX-drag.x;drag.moved+=Math.abs(dx);vy=dx*.012;yaw+=vy;drag.x=e.clientX;return}cv.style.cursor=hit(e)?"pointer":"grab"});
  cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,moved:0};cv.style.cursor="grabbing"});
  cv.addEventListener("pointercancel",()=>{drag=null;cv.style.cursor="grab"});
  addEventListener("pointerup",e=>{if(!drag)return;const d=drag;drag=null;cv.style.cursor="grab";
    if(d.moved<6&&e.target===cv){const b=hit(e);if(b){b.userData.dead=1;burst(b.getWorldPosition(new THREE.Vector3()));b.visible=false;cleared++;if(zap){zap.textContent=cleared;zap.parentNode.classList.remove("pop");void zap.offsetWidth;zap.parentNode.classList.add("pop")}
      setTimeout(()=>spawn(b,false),1600)}}});
  new IntersectionObserver(([e])=>vis=e.isIntersecting).observe(stage);

  /* ---------- loop ---------- */
  const clk=new THREE.Clock();let emA=0;
  (function loop(){requestAnimationFrame(loop);if(!vis)return;const dt=Math.min(clk.getDelta(),.05),tt=clk.elapsedTime,s=Math.min(scrollY/600,1.2);
    if(!reduce){
      if(!drag){yaw+=vy;vy*=.94}
      tooth.rotation.y+=((-.4+tt*.3+s*2.4+mx*.8+yaw)-tooth.rotation.y)*.08;tooth.rotation.x+=((.2+my*.5)-tooth.rotation.x)*.06;tooth.position.y=Math.sin(tt*1.1)*.1;
      ring.rotation.y-=dt*.35;emA+=dt*.55;
      bandFront.map&&(bandFront.map.offset.x=(bandFront.map.offset.x+dt*.01)%1);
      emblem.position.set(Math.cos(emA)*(RING+.02),0,Math.sin(emA)*(RING+.02));
      const inFront=emblem.getWorldPosition(v).z>0;emblem.material.opacity+=((inFront?1:.35)-emblem.material.opacity)*.15;
      shell.rotation.y+=dt*.05;
      bugs.forEach(b=>{if(b.userData.dead&&!b.visible)return;const u=b.userData;
        if(u.grow<1){u.grow=Math.min(1,u.grow+dt*1.5);b.scale.setScalar(Math.max(.01,u.grow))}
        // drift toward the tooth with a little wander
        if(u.cool>0)u.cool-=dt;v.copy(b.position).negate().setLength(.09*dt);u.v.add(v);u.v.x+=Math.sin(tt*1.3+b.id)*.004;u.v.y+=Math.cos(tt*1.1+b.id)*.004;
        u.v.clampLength(.12,.55);b.position.addScaledVector(u.v,dt);
        const d=b.position.length();
        if(d<SHIELD+.18){const n=b.position.clone().normalize();u.v.reflect(n).addScaledVector(n,.35);b.position.copy(n.multiplyScalar(SHIELD+.2));if(!(u.cool>0)){ripple(b.position.clone());u.cool=1.6}}
        if(d>3.8)spawn(b,false);
        b.rotation.x+=u.spin.x*dt;b.rotation.y+=u.spin.y*dt;b.rotation.z+=u.spin.z*dt});
    }else{emblem.position.set(0,0,RING+.02)}
    for(let i=ripples.length-1;i>=0;i--){const m=ripples[i];m.userData.t+=dt;const q=m.userData.t/.8;m.scale.setScalar(1+q*4);m.material.opacity=.9*(1-q);if(q>=1){sc.remove(m);m.material.dispose();ripples.splice(i,1)}}
    for(let i=bits.length-1;i>=0;i--){const m=bits[i];m.userData.t+=dt;m.position.addScaledVector(m.userData.v,dt);m.userData.v.multiplyScalar(.93);m.rotation.x+=.2;m.scale.setScalar(Math.max(.01,1-m.userData.t/.9));if(m.userData.t>.9){sc.remove(m);bits.splice(i,1)}}
    flash*=.9;shell.material.opacity=.035+flash*.1;
    R.render(sc,cam)})();
}

</script>
</body></html>
