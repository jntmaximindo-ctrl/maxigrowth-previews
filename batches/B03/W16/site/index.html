<style>
/* Palet dari brand MHDC/Medikids (brand-capture mhdc.co.id): merah #eb1c1a, navy #19285e, biru muda #6ec1e4, hijau #6ecc39, cokelat #7b573d.
   Font: Fredoka (judul) + Nunito Sans (font brand, isi) + Schoolbell (aksen tulisan tangan). Gaya kartu "stiker" (garis navy + bayangan offset). */
:root{--ink:#19285e;--ink2:#4b5578;--bg:#fbf7f0;--paper:#ffffff;--line:#e4dccd;--cy:#d4191a;--cy2:#b8141a;--red:#eb1c1a;--redsoft:#fde6e3;--sky:#6ec1e4;--skysoft:#e3f3fa;--grass:#6ecc39;--grasssoft:#e8f7dd;--gold:#f2b53a;--goldsoft:#fdf1d6;--wood:#7b573d;--r:24px;--sh:4px 5px 0 var(--ink);--shs:3px 3px 0 var(--ink);--hf:'Fredoka','Nunito','Arial Rounded MT Bold',Arial,sans-serif;--bf:'Nunito Sans','Segoe UI',Arial,sans-serif;--af:'Schoolbell','Comic Sans MS',cursive}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--bf);overflow-x:hidden}
h1,h2,h3{margin:0;line-height:1.1}
h1,h2{font-family:var(--hf);font-weight:600;letter-spacing:-.01em}
h2{font-size:clamp(32px,4.4vw,52px)}h3{font-family:var(--hf);font-size:19px;font-weight:600;line-height:1.25}
p{margin:0}a{color:inherit}button{font:inherit;color:inherit}
img,svg{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
section{padding:84px 0;scroll-margin-top:70px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
.chk{display:inline-block;font:700 11.5px/1.3 var(--bf);color:#7a5200;background:var(--goldsoft);border:1px dashed #d19a2a;border-radius:6px;padding:2px 7px;vertical-align:middle;white-space:nowrap}
.hand{font-family:var(--af);font-size:26px;line-height:1.1;color:var(--cy2)}
/* signature: jalur petualangan (garis putus-putus berbelok + 3 titik warna brand) */
.trail{display:block;width:170px;height:30px;margin-bottom:12px}
.trail path{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:3 7}
.shd{display:grid;grid-template-columns:1.05fr .95fr;gap:18px 60px;align-items:end;margin-bottom:38px}
.lead{color:var(--ink2);font-size:17px}
@media(max-width:860px){.shd{grid-template-columns:1fr;margin-bottom:26px}section{padding:62px 0}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border-radius:999px;font:700 15.5px var(--bf);text-decoration:none;border:2px solid var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s;white-space:nowrap;box-shadow:var(--shs)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn-r{background:var(--cy);color:#fff}
.btn-w{background:#1f8f55;color:#fff}
.btn-d{background:var(--ink);color:#fff}.btn-o{background:var(--paper);color:var(--ink)}
.btn-s{min-height:44px;padding:0 16px;font-size:14.5px}
/* preview banner */
.pv{background:var(--ink);color:#e7ebf7;font-size:13px;text-align:center;padding:8px 16px;line-height:1.45}.pv b{color:#ffd0cc}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(251,247,240,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid transparent;transition:border-color .2s}
.nav.sc{border-color:var(--ink)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:72px}
.brand{display:flex;align-items:center;text-decoration:none;flex:none;min-height:44px}.brand svg{height:50px;width:auto}
.nl{display:flex;gap:2px;margin-left:auto}.nl a{text-decoration:none;font-weight:700;font-size:15px;padding:10px 11px;border-radius:999px;color:var(--ink2)}.nl a:hover{background:var(--skysoft);color:var(--ink)}
.lang{display:flex;border:2px solid var(--ink);border-radius:999px;padding:3px;background:#fff}
.lang button{border:0;background:none;min-width:40px;min-height:36px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink2)}.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.burger{display:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer;align-items:center;justify-content:center}
@media(max-width:1060px){.nl{display:none}.burger{display:inline-flex}.nav .btn{display:none}.lang{margin-left:auto}}
.menu{position:fixed;inset:0;z-index:60;background:rgba(25,40,94,.45);display:none}.menu.on{display:block}
.menu .mp{position:absolute;right:0;top:0;bottom:0;width:min(340px,88vw);background:var(--bg);padding:22px;display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--ink)}
.menu .mp a:not(.btn){text-decoration:none;font:600 26px var(--hf);padding:10px 6px;border-bottom:2px dashed var(--line)}
.menu .x{align-self:flex-end;width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:22px;cursor:pointer}
/* hero */
.hero{position:relative;padding:36px 0 34px;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(180deg,rgba(110,204,57,0),rgba(110,204,57,.10));pointer-events:none}
.hg{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;position:relative}
.hero .kick{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;font-weight:800;color:var(--ink);font-size:14px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 14px 6px 10px}
.hero .kick .i{color:var(--cy)}
.hero h1{font-size:clamp(42px,6vw,78px);letter-spacing:-.02em;line-height:1.02}
.hero h1 .u{color:var(--cy);position:relative;white-space:nowrap}
.hero h1 .u svg{position:absolute;left:0;bottom:-.16em;width:100%;height:.3em;overflow:visible}
.hero h1 .u path{fill:none;stroke:var(--sky);stroke-width:6;stroke-linecap:round;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.4s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero .lead{margin:20px 0 20px;max-width:540px}
.stt{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:9px 14px;font-size:14.5px;font-weight:700;margin-bottom:22px;max-width:100%;text-decoration:none}
.dot{width:10px;height:10px;border-radius:50%;background:#aaa;flex:none;box-shadow:0 0 0 4px rgba(0,0,0,.05)}
.st-open .dot{background:#1f9a5c;box-shadow:0 0 0 4px rgba(31,154,92,.18)}.st-closed .dot{background:#c8573c;box-shadow:0 0 0 4px rgba(200,87,60,.15)}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.stage{position:relative;aspect-ratio:1/1;max-width:560px;width:100%;justify-self:center;touch-action:pan-y}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;z-index:2}
.stage .halo{position:absolute;inset:10%;border-radius:50%;background:var(--skysoft);border:3px solid var(--ink);z-index:0;overflow:hidden}
.stage .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:36%}
.stage .fb{position:absolute;inset:16%;width:68%;height:68%;z-index:1}
.stage .fb .bug{transform-box:fill-box;transform-origin:center;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translate(4px,-6px) rotate(12deg)}}
.zap{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:3;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:700;box-shadow:var(--shs);white-space:nowrap;display:none}
.zap.on{display:block}.zap b{color:var(--cy);font-size:16px}.zap.pop{animation:pop .35s}@keyframes pop{50%{transform:translateX(-50%) scale(1.08)}}
.cloud{position:absolute;z-index:3;font-family:var(--af);font-size:23px;line-height:1.05;background:#fff;border:2px solid var(--ink);border-radius:18px 18px 18px 4px;padding:6px 14px 5px;box-shadow:var(--shs);color:var(--ink)}
.cloud.a{top:6%;right:0}.cloud.b{bottom:17%;left:0;border-radius:18px 18px 4px 18px}
@media(max-width:860px){.hg{grid-template-columns:1fr}.stage{max-width:310px;order:-1;margin:0 auto -8px}.cloud{font-size:19px}.hero{padding-top:18px}}
/* proof */
.proof{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px;position:relative}
.pf{padding:16px 16px;display:flex;gap:12px;align-items:flex-start;text-decoration:none;min-height:44px;background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:var(--shs)}
.pf .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--redsoft);color:var(--cy2);border:2px solid var(--ink)}
.pf:nth-child(2) .ic{background:var(--skysoft);color:var(--ink)}.pf:nth-child(3) .ic{background:var(--grasssoft);color:#2e6b12}.pf:nth-child(4) .ic{background:var(--goldsoft);color:#7a5200}
.pf b{display:block;font:600 22px/1.1 var(--hf)}.pf span.s{font-size:13.5px;color:var(--ink2);line-height:1.4;display:block;margin-top:3px}
@media(max-width:900px){.proof{grid-template-columns:1fr 1fr}}
@media(max-width:440px){.proof{grid-template-columns:1fr}}
/* check teeth */
#cek{background:var(--skysoft);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.prog{display:flex;gap:8px;margin-bottom:16px;position:sticky;top:72px;z-index:5;background:rgba(227,243,250,.95);padding:8px 0;backdrop-filter:blur(6px)}
.ps{flex:1;display:flex;align-items:center;gap:10px;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 12px 6px 6px;min-height:48px;cursor:pointer;text-align:left}
.ps i{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);flex:none;display:grid;place-items:center;font:700 13px var(--hf);font-style:normal;background:#fff}
.ps.on{background:var(--goldsoft)}.ps.done i{background:var(--grass);color:var(--ink)}
.ps em{font-style:normal;font-weight:800;font-size:14px;line-height:1.2}
.console{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
.cl,.cr{background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.chd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.step{font:800 12px var(--bf);letter-spacing:.14em;text-transform:uppercase;color:var(--cy2);margin-bottom:4px}
.seg{display:flex;background:var(--skysoft);border:2px solid var(--ink);border-radius:999px;padding:3px}
.seg button{border:0;background:none;min-height:40px;padding:0 14px;border-radius:999px;font-weight:800;font-size:13.5px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.aw{position:relative}
.arch{width:100%;height:auto;display:block;touch-action:manipulation}
.arch .gum{opacity:.95}
.arch .t{cursor:pointer;outline:none}
.arch .t .body{fill:#fff;stroke:#7d86a6;stroke-width:1.2}.arch .t .gr{fill:none;stroke:#cbd0e0;stroke-width:1}
.arch .t .halo{fill:transparent}
.arch .t:hover .body{stroke:var(--ink)}.arch .t:focus-visible .halo{fill:rgba(110,193,228,.35)}
.arch .t.on .body{fill:#ff8f87;stroke:#9e1014}.arch .t.on .halo{fill:rgba(235,28,26,.18)}
.arch .hit{fill:transparent}
.arch .nb{pointer-events:none}.arch .nb circle{fill:#eef1f8}.arch .nb text{font:800 7.5px var(--bf);fill:#5b6588}
.arch .nb.on circle{fill:var(--ink)}.arch .nb.on text{fill:#fff}
.arch text.jl{font:800 11px var(--bf);letter-spacing:.2em;fill:#a4acc6}
.arch.zu .nb[data-jaw="1"],.arch.zl .nb[data-jaw="0"]{opacity:.15}
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:52%;pointer-events:none}
.ctr>*{pointer-events:auto}.ctr .big{font:600 44px/1 var(--hf);color:var(--cy)}.ctr .sm{font-size:13px;color:var(--ink2)}
.aw.zm .ctr{display:none}
.mchips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0}
.mchip{display:inline-flex;align-items:center;gap:2px;background:var(--redsoft);border:1.5px solid var(--ink);border-radius:999px;padding:1px 1px 1px 10px;font-size:12px;font-weight:800}
.mchip button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}
.clr,.skip{border:0;background:none;text-decoration:underline;font-weight:800;font-size:13px;cursor:pointer;min-height:40px;padding:0 8px}
.tip{position:absolute;transform:translate(-50%,-120%);background:var(--ink);color:#fff;font-size:12px;padding:5px 9px;border-radius:8px;pointer-events:none;opacity:0;white-space:nowrap;transition:opacity .15s}.tip.on{opacity:1}
.toast{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1}
.orient{font-size:12.5px;color:var(--ink2);text-align:center;margin-top:4px}
.kl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 18px}
.k{border:2px solid var(--ink);background:#fff;border-radius:18px;padding:10px 6px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-weight:800;font-size:13px;line-height:1.2;text-align:center;position:relative}
.k .ki{width:34px;height:34px;border-radius:50%;background:var(--skysoft);display:grid;place-items:center}.k .ki svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.k[aria-checked=true]{background:var(--ink);color:#fff;box-shadow:var(--shs)}.k[aria-checked=true] .ki{background:var(--gold)}
.k .ud{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%}.k .u2{background:var(--gold)}.k .u3{background:var(--red)}
.res{border-radius:20px;background:var(--bg);border:2px dashed #c9bfae;padding:18px}
.res.empty p{font-size:14px;color:var(--ink2);margin-top:8px}.res.empty b{display:block;color:var(--ink)}
.skl{height:12px;border-radius:6px;background:#ebe3d4;margin:8px 0}
.gbtn{margin-top:12px;border-radius:999px;background:#ebe3d4;color:#8a8170;text-align:center;padding:12px;font-weight:800;font-size:14px}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rk{font:800 11.5px var(--bf);letter-spacing:.14em;color:var(--ink2)}
.urg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px;background:#fff;border:1.5px solid var(--ink)}.urg i{width:8px;height:8px;border-radius:50%;background:#1f9a5c}.urg.u2 i{background:var(--gold)}.urg.u3 i{background:var(--red)}.urg.u3{color:#9e1014}
.res h3{margin:8px 0 6px;outline:none;font:600 26px/1.15 var(--hf)}.res .ex{font-size:14.5px;color:var(--ink2)}
.rteeth{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.rteeth span{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-weight:700}
.rtl{font:800 12.5px var(--bf);margin:12px 0 6px}
.tl{list-style:none;margin:0;padding:0;font-size:14px}.tl li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed #d8cfbf}.tl li span:last-child{font-weight:800;text-align:right}.tl em{font-style:normal;color:var(--ink2);font-weight:700}
.est{font-size:12.5px;color:var(--ink2);margin:8px 0 12px}
.bubh{display:flex;justify-content:space-between;align-items:center}.bubh label{font-weight:800;font-size:13px}
.mrst{border:0;background:none;text-decoration:underline;font-size:12.5px;cursor:pointer;min-height:36px}
textarea.bub{width:100%;border:2px solid var(--ink);border-radius:18px 18px 18px 4px;background:#e7f8ec;padding:10px 12px;font:14.5px/1.5 var(--bf);resize:vertical;min-height:88px;color:var(--ink)}
.pref{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-size:13px;font-weight:800}
.pref button,.chipb{border:2px solid var(--ink);background:#fff;border-radius:999px;min-height:42px;padding:0 13px;font-size:13px;font-weight:800;cursor:pointer}
.pref button[aria-pressed=true],.chipb[aria-pressed=true]{background:var(--ink);color:#fff}
.ract{display:flex;flex-wrap:wrap;gap:10px}
.copy{border:2px solid var(--ink);background:#fff;border-radius:999px;min-height:50px;padding:0 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.disc{font-size:12px;color:var(--ink2);margin-top:12px}
@media(max-width:900px){.console{grid-template-columns:1fr}}
@media(max-width:520px){.kl{grid-template-columns:repeat(2,1fr)}.k{flex-direction:row;justify-content:flex-start;min-height:54px;padding:8px 10px;text-align:left}.cl,.cr{padding:16px}.ps em{font-size:12.5px}.ps{padding:5px 8px 5px 5px;gap:6px}.ps i{width:26px;height:26px}}
/* jadwal (fitur khas) */
#jadwal{background:var(--ink);color:#e9edf8}
#jadwal h2{color:#fff}#jadwal .lead{color:#c3cae3}#jadwal .trail path{stroke:#9aa5cf}#jadwal .step{color:#ffb3ad}#jadwal .hand{color:var(--sky)}
.jg{display:grid;grid-template-columns:.95fr 1.05fr;gap:20px}
.jbox{background:#23346f;border:2px solid #0e1840;border-radius:var(--r);padding:22px;box-shadow:4px 5px 0 #0e1840}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.wb{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:2px solid #4a5a93;background:#1c2b62;border-radius:18px;padding:12px;min-height:88px;cursor:pointer;text-align:left;color:#e9edf8}
.wb .wi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#2f4185}.wb .wi svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wb b{display:block;font:600 16px/1.15 var(--hf)}.wb small{display:block;margin-top:2px;font-size:11.5px;color:#aeb8dc;line-height:1.3}
.wb[aria-pressed=true]{background:#fff;color:var(--ink);border-color:#fff}.wb[aria-pressed=true] small{color:var(--ink2)}.wb[aria-pressed=true] .wi{background:var(--red)}
.board{margin-top:16px;border-radius:18px;background:#1c2b62;border:2px solid #4a5a93;padding:10px}
.brow{display:grid;grid-template-columns:62px repeat(7,1fr);gap:5px;align-items:stretch}
.brow+.brow{margin-top:5px}
.bh{font:800 11px var(--bf);letter-spacing:.06em;color:#aeb8dc;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.bh b{font:600 17px var(--hf);color:#fff;letter-spacing:0}
.bl{font:800 11.5px var(--bf);color:#c3cae3;display:flex;flex-direction:column;justify-content:center;line-height:1.15}.bl small{font-weight:600;font-size:10.5px;color:#8f9ac4}

.cell .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:36px}.cell .dots i{width:7px;height:7px;border-radius:50%;background:#8f9ac4;display:block}.cell .dots i.d-kga{background:var(--sky)}.cell .dots i.d-bm{background:var(--gold)}.cell .dots i.d-dr{background:var(--grass)}
.cell[aria-pressed=true]{background:#fff;border-color:#fff;color:var(--ink)}

.cell.today{border-style:dashed;border-color:#ffb3ad}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:#c3cae3}.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.docs{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:340px;overflow:auto;padding-right:4px}
.doc{display:flex;align-items:center;gap:12px;border:2px solid #4a5a93;background:#1c2b62;border-radius:18px;padding:8px 12px 8px 8px;min-height:62px;cursor:pointer;text-align:left;color:#e9edf8;width:100%}
.doc .av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;border:2px solid #0e1840}.doc .av svg{width:100%;height:100%;display:block}
.doc b{display:block;font-size:14.5px;line-height:1.25}.doc small{display:block;font-size:12px;color:#aeb8dc}
.doc[aria-pressed=true]{border-color:#fff;background:#2f4185}
.doc .tag{margin-left:auto;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--sky);color:var(--ink);white-space:nowrap}
.doc .tag.bm{background:var(--gold)}.doc .tag.dr{background:var(--grass)}.doc .tag.u{background:#c3cae3}
.none{font-size:14px;color:#c3cae3;background:#1c2b62;border:2px dashed #4a5a93;border-radius:16px;padding:14px}
.none button{margin-top:8px}
.kid{margin-top:14px;display:none}.kid.on{display:block}
.kid .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kid .chipb{background:#1c2b62;color:#e9edf8;border-color:#4a5a93}.kid .chipb[aria-pressed=true]{background:#fff;color:var(--ink);border-color:#fff}
.calm{display:flex;align-items:center;gap:10px;margin-top:12px;border:2px dashed #4a5a93;border-radius:14px;padding:10px 12px;cursor:pointer;min-height:48px;font-size:14px}
.calm input{width:20px;height:20px;accent-color:var(--red);flex:none}
.fsum{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 8px}.fsum span{font-size:12.5px;background:#1c2b62;border:1px solid #4a5a93;border-radius:999px;padding:4px 10px}
#jadwal textarea.bub{border-color:#0e1840}
#jadwal .copy{background:#1c2b62;color:#e9edf8;border-color:#4a5a93}
#jadwal .btn-w{border-color:#0e1840;box-shadow:3px 3px 0 #0e1840}
#jadwal .chk{background:#3d3620;color:#ffdf94;border-color:#8d7322}
#jadwal .disc{color:#aeb8dc}
@media(max-width:900px){.jg{grid-template-columns:1fr}}
@media(max-width:520px){.who{grid-template-columns:1fr}.wb{flex-direction:row;align-items:center;min-height:60px}.brow{grid-template-columns:44px repeat(7,1fr);gap:3px}.bl{font-size:10.5px}.bl small{display:none}.cell{min-height:46px;border-radius:10px}.bh b{font-size:15px}.jbox{padding:16px}}

.pr{display:flex;justify-content:space-between;align-items:baseline;gap:6px;border-top:2px dashed var(--line);padding-top:10px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}.pr b{font:600 19px var(--hf);color:var(--ink)}
.svc a{font-weight:800;font-size:14px;color:var(--cy2);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.svc.alt{background:var(--red);color:#fff}.svc.alt p{color:#ffe3e0}.svc.alt .ic{background:#fff;color:var(--cy)}.svc.alt a{color:#fff}
.cic{background:var(--goldsoft);border:2px solid var(--ink);border-radius:var(--r);padding:20px;margin-top:18px;display:grid;grid-template-columns:1fr 1.2fr;gap:18px;align-items:center;box-shadow:var(--shs)}
.cic input[type=range]{width:100%;accent-color:var(--cy);min-height:34px}
.cic .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}.cic .row b{font:600 20px var(--hf)}
.ten{display:flex;gap:6px;margin-top:6px}.ten button{flex:1;min-height:44px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-weight:800;cursor:pointer}.ten button[aria-pressed=true]{background:var(--ink);color:#fff}
.pnote{margin-top:16px;font-size:13.5px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start}
@media(max-width:1000px){.sv{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.sv{grid-template-columns:1fr 1fr}.cic{grid-template-columns:1fr}}@media(max-width:480px){.sv{grid-template-columns:1fr}}
/* team */
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.fl button{border:2px solid var(--ink);background:#fff;border-radius:999px;min-height:44px;padding:0 15px;font-weight:800;font-size:13.5px;cursor:pointer}.fl button[aria-pressed=true]{background:var(--ink);color:#fff}
.dg{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.dc{background:#fff;border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shs)}
.dc .pp{aspect-ratio:1/1;position:relative;border-bottom:2px solid var(--ink)}.dc .pp svg{width:100%;height:100%;display:block}
.dc .db{padding:12px 14px 12px;flex:1;display:flex;flex-direction:column}.dc .db h3{font-size:15.5px}.dc .db p{font-size:12.5px;color:var(--ink2);margin-top:3px}

@media(max-width:1000px){.dg{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.dg{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.dg{grid-template-columns:1fr 1fr}}

.close{background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:36px;padding:46px;display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:center;position:relative;overflow:hidden;box-shadow:6px 7px 0 var(--ink)}
.close h2{font-size:clamp(32px,4.2vw,50px)}.close p{color:#ffe3e0;margin-top:10px}.close .hand{color:#fff}

.close .bgm{position:absolute;right:-30px;bottom:-60px;width:300px;opacity:.14;pointer-events:none}

footer{padding:40px 0 110px;font-size:14px;color:var(--ink2)}

.ft b{display:block;color:var(--ink);margin-bottom:6px}.ft a{text-decoration:none;display:inline-block;min-height:32px}

.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}

<script id="mg-mapfix">

  $$("#fq .q button").forEach((b,i)=>b.onclick=()=>{openQ=openQ===i?-1:i;$$("#fq .q").forEach((q,j)=>{q.classList.toggle("open",j===openQ);q.querySelector("button").setAttribute("aria-expanded",j===openQ)})})}

/* ---------- FAB ---------- */
const fab=$("#fab");let heroV=true,cekV=false,closeV=false,findV=false;
function fabUpd(){fab.classList.toggle("on",scrollY>400&&!heroV&&!cekV&&!closeV&&!findV)}
const vis=(x,fn)=>new IntersectionObserver(([e])=>{fn(e.isIntersecting);fabUpd()}).observe(x);
vis($("#ctas"),v=>heroV=v);vis($("#cek .console"),v=>cekV=v);vis($("#close"),v=>closeV=v);vis($("#jadwal .jg"),v=>findV=v);
addEventListener("scroll",()=>{nav.classList.toggle("sc",scrollY>10);fabUpd()},{passive:true});
$("#yr").textContent=Math.max(2026,new Date().getFullYear());

/* ---------- boot ---------- */
try{const s=localStorage.getItem("mk-lang");if(s==="en"||s==="id")L=s}catch(e){}
applyLang();setInterval(()=>{status();drawBoard()},60000);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
$$(".rv").forEach(e=>io.observe(e));
</script>
<script>
const EMB="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="#fff" stroke="#19285e" stroke-width="6"/><g transform="translate(52 34) scale(.96)"><path d="'+TOOTHP+'" fill="#eb1c1a"/><circle cx="36" cy="32" r="5" fill="#fff"/><circle cx="64" cy="32" r="5" fill="#fff"/><path d="M37 46q13 11 26 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g><text x="100" y="158" text-anchor="middle" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-weight="700" font-size="30" fill="#eb1c1a">medikids</text></svg>');
</script>
<script>
addEventListener("load",()=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";s.onload=init3d;s.onerror=()=>{};document.head.appendChild(s)});
function init3d(){
  const stage=document.getElementById("stage");let R;
  try{R=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){return}
  R.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(R.domElement);document.getElementById("fb").style.display="none";document.getElementById("zap").classList.add("on");
  const badge=stage.querySelector(".badge");if(badge)badge.style.display="none";
  const cv=R.domElement;cv.style.touchAction="pan-y";cv.style.cursor="grab";
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,.1,100);cam.position.set(0,.15,9.4);
  const TAU=Math.PI*2,v=new THREE.Vector3(),rnd=(a,b)=>a+Math.random()*(b-a);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- tooth (faceted, like the logo) ---------- */
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3,metalness:.04,flatShading:false});
  const edge=new THREE.LineBasicMaterial({color:0x19285e,transparent:true,opacity:.14});
  const tooth=new THREE.Group();
  function addFaceted(geo,pos,rot){const m=new THREE.Mesh(geo,mat);m.position.copy(pos);if(rot)m.rotation.z=rot;tooth.add(m);const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo,1),edge);e.position.copy(pos);if(rot)e.rotation.z=rot;tooth.add(e)}
  const cg=new THREE.SphereGeometry(1.2,28,20),p=cg.attributes.position;
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);v.x*=1.05;v.z*=.9;if(v.y>0){const r=Math.hypot(v.x,v.z),th=Math.atan2(v.z,v.x);v.y=v.y*.75+.2*Math.cos(4*th)*(r/1.2)-.3*Math.max(0,1-r/.7)}else v.y*=.55;p.setXYZ(i,v.x,v.y,v.z)}
  cg.computeVertexNormals();addFaceted(cg,new THREE.Vector3(0,.6,0));
  [-1,1].forEach(sd=>{const rg=new THREE.ConeGeometry(.45,1.9,18,4,true);rg.rotateX(Math.PI);addFaceted(rg,new THREE.Vector3(sd*.47,-.65,0),sd*.12)});
  tooth.rotation.set(.2,-.4,0);tooth.scale.setScalar(1.08);sc.add(tooth);

  /* ---------- perisai: cincin nama klinik + emblem logo mengorbit ---------- */
  const RING=2.0,SHIELD=2.08;
  const ring=new THREE.Group();ring.rotation.set(.32,0,-.14);sc.add(ring);
  function bandTexture(){
    const c=document.createElement("canvas");c.width=2048;c.height=96;const x=c.getContext("2d");
    x.font="600 46px 'Fredoka', 'Nunito', Arial, sans-serif";x.fillStyle="#19285e";x.textBaseline="middle";
    const unit="MEDIKIDS DAGO BANDUNG   ●   MHDC GROUP   ●   ";
    const w=x.measureText(unit).width,n=Math.max(1,Math.round(c.width/w)),sx=c.width/(w*n);
    x.save();x.scale(sx,1);for(let i=0;i<n;i++)x.fillText(unit,i*w,c.height/2+2);x.restore();
    [["#eb1c1a",0],["#6ec1e4",.33],["#6ecc39",.66]].forEach(([col,o])=>{x.fillStyle=col;x.fillRect(o*c.width,4,c.width*.3,4);x.fillRect(o*c.width+c.width*.02,c.height-8,c.width*.3,4)});
    const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;t.anisotropy=4;return t}
  const bandGeo=new THREE.CylinderGeometry(RING,RING,.3,160,1,true);
  const bandFront=new THREE.MeshBasicMaterial({transparent:true,side:THREE.FrontSide,depthWrite:false});
  const bandBack=new THREE.MeshBasicMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,opacity:.22});
  const bandF=new THREE.Mesh(bandGeo,bandFront),bandB=new THREE.Mesh(bandGeo,bandBack);ring.add(bandB,bandF);
  const setBand=()=>{const t=bandTexture();bandFront.map=t;bandBack.map=t;bandFront.needsUpdate=bandBack.needsUpdate=true};
  setBand();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(setBand);
  // logo emblem riding the ring
  const logoImg=new Image(),logoTex=new THREE.Texture(logoImg);
  logoImg.onload=()=>{const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d");g.fillStyle="#fff";g.beginPath();g.arc(256,256,250,0,7);g.fill();g.drawImage(logoImg,56,56,400,400);logoTex.image=c;logoTex.needsUpdate=true};
  logoImg.src=EMB;/* emblem logo sementara Medikids */
  const emblem=new THREE.Sprite(new THREE.SpriteMaterial({map:logoTex,transparent:true}));emblem.scale.set(.95,.95,1);ring.add(emblem);
  // faint protective shell + ripples where bacteria are stopped
  const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(SHIELD,1),new THREE.MeshBasicMaterial({color:0x6ec1e4,wireframe:true,transparent:true,opacity:.035,depthWrite:false}));sc.add(shell);
  const ripples=[];const rippleGeo=new THREE.RingGeometry(.12,.17,40);
  function ripple(pt){const m=new THREE.Mesh(rippleGeo,new THREE.MeshBasicMaterial({color:0xeb1c1a,transparent:true,opacity:.9,side:THREE.DoubleSide,depthWrite:false}));
    m.position.copy(pt).setLength(SHIELD);m.lookAt(pt.clone().multiplyScalar(2));m.userData.t=0;sc.add(m);ripples.push(m);flash=1}
  let flash=0;

  /* ---------- bacteria ---------- */
  const ink=new THREE.MeshStandardMaterial({color:0x19285e,roughness:.45,metalness:.1,flatShading:true});
  const red=new THREE.MeshStandardMaterial({color:0xeb1c1a,roughness:.45,metalness:.05,flatShading:true});const gold=new THREE.MeshStandardMaterial({color:0xf2b53a,roughness:.4,metalness:.1,flatShading:true});const sky=new THREE.MeshStandardMaterial({color:0x6ecc39,roughness:.4,metalness:.1,flatShading:true});
  const ball=(r,m)=>new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),m);
  const tube=(pts,r,m,seg)=>new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),seg||40,r,5,false),m);
  const MAKERS=[
    m=>{const g=new THREE.Group();g.add(ball(.17,m));for(let i=0;i<8;i++){const a=i/8*TAU,s=ball(.03,gold);s.position.set(Math.cos(a)*.19,Math.sin(a)*.19,0);g.add(s)}return g}, // coccus with pili
    m=>{const g=new THREE.Group();[-.11,.11].forEach(x=>{const b=ball(.12,m);b.position.x=x;b.scale.set(.9,1.05,1);g.add(b)});return g}, // diplococcus
    m=>{const g=new THREE.Group();for(let i=0;i<5;i++){const b=ball(.085,m);b.position.set(i*.16-.32,Math.sin(i*1.1)*.07,0);g.add(b)}return g}, // streptococcus chain
    m=>{const g=new THREE.Group();[[0,0,0],[.13,.05,0],[-.12,.07,.04],[.02,.15,-.05],[.07,-.12,.05],[-.08,-.1,-.04],[.14,-.03,-.08]].forEach(q=>{const b=ball(.075,m);b.position.set(...q);g.add(b)});return g}, // staphylococcus
    m=>{const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.32,8),m);body.rotation.z=Math.PI/2;g.add(body);[-.16,.16].forEach(x=>{const c=ball(.08,m);c.position.x=x;g.add(c)});
      const pts=[];for(let i=0;i<=12;i++)pts.push(new THREE.Vector3(.22+i*.045,Math.sin(i*1.1)*.05,0));g.add(tube(pts,.012,gold,30));return g}, // bacillus + flagellum
    m=>{const pts=[];for(let i=0;i<=40;i++){const t=i/40;pts.push(new THREE.Vector3((t-.5)*.7,Math.cos(t*TAU*2.5)*.08,Math.sin(t*TAU*2.5)*.08))}return tube(pts,.035,m,80)}, // spirillum
    m=>{const g=new THREE.Group();const pts=[];for(let i=0;i<=10;i++){const a=-.9+i*.18;pts.push(new THREE.Vector3(Math.cos(a)*.22,Math.sin(a)*.22,0))}g.add(tube(pts,.06,m,24));
      const f=[];for(let i=0;i<=10;i++)f.push(new THREE.Vector3(.14+i*.03,-.2-i*.035,Math.sin(i)*.03));g.add(tube(f,.01,gold,20));return g} // vibrio
  ];
  const bugs=[];
  function spawn(b,first){const a=rnd(0,TAU),r=first?rnd(2.6,3.1):3.4;b.position.set(Math.cos(a)*r,rnd(-1.5,1.6),Math.sin(a)*r*.45);
    b.userData.v=new THREE.Vector3(-b.position.x,-b.position.y*.5,-b.position.z).setLength(rnd(.25,.45));b.userData.spin=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1));b.userData.dead=0;b.visible=true;b.scale.setScalar(first?1:.01);b.userData.grow=first?1:0}
  const N=innerWidth<700?7:10;
  for(let i=0;i<N;i++){const b=MAKERS[i%MAKERS.length]([ink,red,sky,gold][i%4]);b.traverse(o=>{if(o.isMesh)o.userData.bug=b});sc.add(b);bugs.push(b);spawn(b,true)}
  // debris from a cleared bacterium
  const bits=[];const bitGeo=new THREE.TetrahedronGeometry(.045);
  function burst(pt){for(let i=0;i<10;i++){const m=new THREE.Mesh(bitGeo,i%2?gold:ink);m.position.copy(pt);m.userData.v=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).setLength(rnd(1.2,2.4));m.userData.t=0;sc.add(m);bits.push(m)}}

  /* ---------- lights ---------- */
  sc.add(new THREE.HemisphereLight(0xffffff,0xe3f3fa,.95));
  const k=new THREE.DirectionalLight(0xffffff,.9);k.position.set(3,4,5);sc.add(k);
  const g2=new THREE.PointLight(0xffd0cc,.8,14);g2.position.set(-3,-1,3);sc.add(g2);
  function size(){const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}size();addEventListener("resize",size);

  /* ---------- interaction: drag to spin, tap bacteria to clear ---------- */
  let mx=0,my=0,vis=true,drag=null,yaw=0,pitch=0,vy=0,cleared=0;
  const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
  const zap=document.getElementById("zapc");
  function hit(e){const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,cam);
    const h=ray.intersectObjects(bugs.filter(b=>b.visible&&!b.userData.dead),true)[0];return h&&h.object.userData.bug}
  addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
  cv.addEventListener("pointermove",e=>{if(drag){const dx=e.clientX-drag.x;drag.moved+=Math.abs(dx);vy=dx*.012;yaw+=vy;drag.x=e.clientX;return}cv.style.cursor=hit(e)?"pointer":"grab"});
  cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,moved:0};cv.style.cursor="grabbing"});
  cv.addEventListener("pointercancel",()=>{drag=null;cv.style.cursor="grab"});
  addEventListener("pointerup",e=>{if(!drag)return;const d=drag;drag=null;cv.style.cursor="grab";
    if(d.moved<6&&e.target===cv){const b=hit(e);if(b){b.userData.dead=1;burst(b.getWorldPosition(new THREE.Vector3()));b.visible=false;cleared++;if(zap){zap.textContent=cleared;zap.parentNode.classList.remove("pop");void zap.offsetWidth;zap.parentNode.classList.add("pop")}
      setTimeout(()=>spawn(b,false),1600)}}});
  new IntersectionObserver(([e])=>vis=e.isIntersecting).observe(stage);

  /* ---------- loop ---------- */
  const clk=new THREE.Clock();let emA=0;
  (function loop(){requestAnimationFrame(loop);if(!vis)return;const dt=Math.min(clk.getDelta(),.05),tt=clk.elapsedTime,s=Math.min(scrollY/600,1.2);
    if(!reduce){
      if(!drag){yaw+=vy;vy*=.94}
      tooth.rotation.y+=((-.4+tt*.3+s*2.4+mx*.8+yaw)-tooth.rotation.y)*.08;tooth.rotation.x+=((.2+my*.5)-tooth.rotation.x)*.06;tooth.position.y=Math.sin(tt*1.1)*.1;
      ring.rotation.y-=dt*.35;emA+=dt*.55;
      bandFront.map&&(bandFront.map.offset.x=(bandFront.map.offset.x+dt*.01)%1);
      emblem.position.set(Math.cos(emA)*(RING+.02),0,Math.sin(emA)*(RING+.02));
      const inFront=emblem.getWorldPosition(v).z>0;emblem.material.opacity+=((inFront?1:.35)-emblem.material.opacity)*.15;
      shell.rotation.y+=dt*.05;
      bugs.forEach(b=>{if(b.userData.dead&&!b.visible)return;const u=b.userData;
        if(u.grow<1){u.grow=Math.min(1,u.grow+dt*1.5);b.scale.setScalar(Math.max(.01,u.grow))}
        // drift toward the tooth with a little wander
        if(u.cool>0)u.cool-=dt;v.copy(b.position).negate().setLength(.09*dt);u.v.add(v);u.v.x+=Math.sin(tt*1.3+b.id)*.004;u.v.y+=Math.cos(tt*1.1+b.id)*.004;
        u.v.clampLength(.12,.55);b.position.addScaledVector(u.v,dt);
        const d=b.position.length();
        if(d<SHIELD+.18){const n=b.position.clone().normalize();u.v.reflect(n).addScaledVector(n,.35);b.position.copy(n.multiplyScalar(SHIELD+.2));if(!(u.cool>0)){ripple(b.position.clone());u.cool=1.6}}
        if(d>3.8)spawn(b,false);
        b.rotation.x+=u.spin.x*dt;b.rotation.y+=u.spin.y*dt;b.rotation.z+=u.spin.z*dt});
    }else{emblem.position.set(0,0,RING+.02)}
    for(let i=ripples.length-1;i>=0;i--){const m=ripples[i];m.userData.t+=dt;const q=m.userData.t/.8;m.scale.setScalar(1+q*4);m.material.opacity=.9*(1-q);if(q>=1){sc.remove(m);m.material.dispose();ripples.splice(i,1)}}
    for(let i=bits.length-1;i>=0;i--){const m=bits[i];m.userData.t+=dt;m.position.addScaledVector(m.userData.v,dt);m.userData.v.multiplyScalar(.93);m.rotation.x+=.2;m.scale.setScalar(Math.max(.01,1-m.userData.t/.9));if(m.userData.t>.9){sc.remove(m);bits.splice(i,1)}}
    flash*=.9;shell.material.opacity=.035+flash*.1;
    R.render(sc,cam)})();
}
</script>
