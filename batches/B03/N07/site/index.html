<style>
:root{--ink:#1d2b2a;--ink2:#3d4a48;--bg:#fbfaf4;--paper:#ffffff;--line:#e5e2d6;--cy:#128a5e;--gold:#128a5e;--green:#1ea37a;--soft:#dcf2e7;--mint:#87d4b8;--sun:#f2c230;--sunsoft:#fdf3cf;--sky:#3a86c8;--skysoft:#e1eefa;--teal:#2f9e8f;--r:26px;--r2:16px;--sh:0 1px 2px rgba(29,43,42,.06),0 10px 30px -12px rgba(29,43,42,.18);--hf:'Sora','Trebuchet MS',Arial,sans-serif;--bf:'Manrope','Segoe UI',Arial,sans-serif;--af:'Gochi Hand','Comic Sans MS',cursive}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--bf);overflow-x:hidden}
h1,h2,h3{font-family:var(--hf);line-height:1.15;margin:0;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,44px);font-weight:800}h3{font-size:19px;font-weight:700}
p{margin:0}a{color:inherit}button{font:inherit;color:inherit}
img,svg{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
section{padding:84px 0;scroll-margin-top:70px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
.chk{display:inline-block;font:600 11.5px/1.3 var(--bf);color:#8a5a00;background:var(--sunsoft);border:1px dashed #d9a520;border-radius:999px;padding:2px 8px;vertical-align:middle;white-space:nowrap}
.note{font-family:var(--af);font-size:21px;color:var(--cy);line-height:1.1}
/* signature: the logo's broken tri-colour stroke */
.arc3{display:inline-flex;gap:6px;align-items:center}.arc3 i{display:block;height:6px;border-radius:9px;background:var(--sun);width:26px}.arc3 i:nth-child(2){background:var(--sky);width:16px}.arc3 i:nth-child(3){background:var(--green);width:38px}
.shd{display:grid;grid-template-columns:1.1fr .9fr;gap:24px 60px;align-items:end;margin-bottom:40px}
.shd .arc3{margin-bottom:16px}.lead{color:var(--ink2);font-size:17px}
@media(max-width:860px){.shd{grid-template-columns:1fr;margin-bottom:28px}section{padding:64px 0}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15.5px;text-decoration:none;border:0;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-g{background:var(--cy);color:#fff;box-shadow:0 8px 20px -8px rgba(18,138,94,.6)}.btn-g:hover{background:#0e7a52}
.btn-d{background:var(--ink);color:#fff}.btn-o{background:var(--paper);border:1.5px solid var(--ink);color:var(--ink)}
.btn-s{min-height:44px;padding:0 16px;font-size:14.5px}
/* preview banner */
.pv{background:var(--ink);color:#e9f5ef;font-size:13px;text-align:center;padding:8px 16px;line-height:1.45}.pv b{color:var(--sun)}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(251,250,244,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.sc{border-color:var(--line)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex:none;min-height:44px}.brand img{width:40px;height:40px}
.brand .bw{display:flex;flex-direction:column;line-height:1}.brand b{font:800 23px/1 var(--hf);color:#33393e;letter-spacing:.02em}.brand small{font:600 9.5px/1 var(--hf);letter-spacing:.24em;color:#1e9470;margin-top:3px}
.nl{display:flex;gap:4px;margin-left:auto}.nl a{text-decoration:none;font-weight:600;font-size:15px;padding:10px 12px;border-radius:999px;color:var(--ink2)}.nl a:hover{background:var(--soft);color:var(--ink)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.lang button{border:0;background:none;min-width:40px;min-height:36px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink2)}.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.burger{display:none;width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;align-items:center;justify-content:center}
.nav .btn{display:inline-flex}
@media(max-width:980px){.nl{display:none}.burger{display:inline-flex}.nav .btn{display:none}.lang{margin-left:auto}}
.menu{position:fixed;inset:0;z-index:60;background:rgba(29,43,42,.4);display:none}.menu.on{display:block}
.menu .mp{position:absolute;right:0;top:0;bottom:0;width:min(340px,88vw);background:var(--bg);padding:22px;display:flex;flex-direction:column;gap:6px;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.menu .mp a:not(.btn){text-decoration:none;font:700 20px var(--hf);padding:12px 6px;border-bottom:1px solid var(--line)}
.menu .x{align-self:flex-end;width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
/* hero */
.hero{position:relative;padding:44px 0 30px;overflow:hidden}
.hg{display:grid;grid-template-columns:1.02fr .98fr;gap:30px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:10px;margin-bottom:18px}
.tag .note{font-size:24px}
.hero h1{font-size:clamp(38px,5.6vw,68px);font-weight:800;letter-spacing:-.035em}
.hero h1 .c1{color:var(--green)}.hero h1 u{text-decoration:none;background:linear-gradient(90deg,var(--sun),var(--sun)) 0 88%/100% .22em no-repeat}
.hero .lead{margin:20px 0 22px;max-width:520px}
.stt{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:10px 14px;font-size:14.5px;margin-bottom:22px;max-width:100%}
.dot{width:10px;height:10px;border-radius:50%;background:#aaa;flex:none;box-shadow:0 0 0 4px rgba(0,0,0,.05)}
.st-open .dot{background:#18a86b;box-shadow:0 0 0 4px rgba(24,168,107,.18)}.st-closed .dot{background:#d0573a;box-shadow:0 0 0 4px rgba(208,87,58,.15)}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.stage{position:relative;aspect-ratio:1/1;max-width:560px;width:100%;justify-self:center;touch-action:pan-y}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;z-index:2}
.stage .bow{position:absolute;inset:4% 0 auto;width:100%;z-index:0;opacity:.9}
.stage .fb{position:absolute;inset:16%;width:68%;height:68%;z-index:1}
.stage .fb .bug{transform-box:fill-box;transform-origin:center;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translate(4px,-6px) rotate(12deg)}}
.zap{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);z-index:3;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13.5px;box-shadow:var(--sh);white-space:nowrap;display:none}
.zap.on{display:block}.zap b{color:var(--cy);font-size:16px}.zap.pop{animation:pop .35s}@keyframes pop{50%{transform:translateX(-50%) scale(1.08)}}
.cloud{position:absolute;z-index:3;font-family:var(--af);font-size:19px;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:var(--sh);color:var(--ink2)}
.cloud.a{top:9%;right:2%}.cloud.b{bottom:15%;left:0}
@media(max-width:860px){.hg{grid-template-columns:1fr}.stage{max-width:300px;order:-1;margin:-10px auto -18px}.cloud{font-size:16px}.hero{padding-top:22px}}
/* proof */
.proof{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px}
.pf{background:#fff;border:1.5px solid var(--line);border-radius:var(--r2);padding:16px 18px;display:flex;gap:12px;align-items:flex-start;text-decoration:none;min-height:44px}
.pf .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.pf:nth-child(1) .ic{background:var(--sunsoft);color:#9a6c00}.pf:nth-child(2) .ic{background:var(--skysoft);color:var(--sky)}.pf:nth-child(3) .ic{background:var(--soft);color:var(--cy)}.pf:nth-child(4) .ic{background:#f1ece2;color:var(--ink2)}
.pf b{display:block;font:800 18px/1.2 var(--hf)}.pf span.s{font-size:13.5px;color:var(--ink2);line-height:1.4;display:block;margin-top:2px}
@media(max-width:860px){.proof{grid-template-columns:1fr 1fr}}@media(max-width:420px){.proof{grid-template-columns:1fr}}
/* check teeth */
#cek{background:linear-gradient(180deg,var(--bg),#f1f7f2)}
.prog{display:flex;gap:8px;margin-bottom:16px;position:sticky;top:68px;z-index:5;background:rgba(241,247,242,.94);padding:8px 0;backdrop-filter:blur(6px)}
.ps{flex:1;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;min-height:48px;cursor:pointer;text-align:left}
.ps i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font:800 12px var(--hf);font-style:normal}
.ps.on{border-color:var(--ink)}.ps.on i{border-color:var(--ink)}.ps.done i{background:var(--green);border-color:var(--green);color:#fff}
.ps em{font-style:normal;font-weight:700;font-size:14px;line-height:1.2}
.console{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
.cl,.cr{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:22px}
.chd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.step{font:700 12px var(--bf);letter-spacing:.14em;text-transform:uppercase;color:var(--cy);margin-bottom:4px}
.seg{display:flex;background:#f1efe7;border-radius:999px;padding:3px}
.seg button{border:0;background:none;min-height:40px;padding:0 14px;border-radius:999px;font-weight:700;font-size:13.5px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.aw{position:relative}
.arch{width:100%;height:auto;display:block;touch-action:manipulation}
.arch .gum{opacity:.9}
.arch .t{cursor:pointer;outline:none}
.arch .t .body{fill:#fff;stroke:#9aa7a2;stroke-width:1.2}.arch .t .gr{fill:none;stroke:#c9d2cf;stroke-width:1}
.arch .t .halo{fill:transparent}
.arch .t:hover .body{stroke:var(--ink)}.arch .t:focus-visible .halo{fill:rgba(58,134,200,.2)}
.arch .t.on .body{fill:var(--sun);stroke:#8a6400}.arch .t.on .halo{fill:rgba(242,194,48,.25)}
.arch .hit{fill:transparent}
.arch .nb{pointer-events:none}.arch .nb circle{fill:#f4f2ea}.arch .nb text{font:700 7.5px var(--bf);fill:#6c7875}
.arch .nb.on circle{fill:var(--ink)}.arch .nb.on text{fill:#fff}
.arch text.jl{font:800 11px var(--hf);letter-spacing:.2em;fill:#b3bdb9}
.arch.zu .nb[data-jaw="1"],.arch.zl .nb[data-jaw="0"]{opacity:.15}
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:52%;pointer-events:none}
.ctr>*{pointer-events:auto}.ctr .big{font:800 34px/1 var(--hf)}.ctr .sm{font-size:13px;color:var(--ink2)}
.aw.zm .ctr{display:none}
.mchips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0}
.mchip{display:inline-flex;align-items:center;gap:2px;background:var(--sunsoft);border-radius:999px;padding:2px 2px 2px 10px;font-size:12px;font-weight:600}
.mchip button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}
.clr,.skip{border:0;background:none;text-decoration:underline;font-weight:700;font-size:13px;cursor:pointer;min-height:40px;padding:0 8px}
.tip{position:absolute;transform:translate(-50%,-120%);background:var(--ink);color:#fff;font-size:12px;padding:5px 9px;border-radius:8px;pointer-events:none;opacity:0;white-space:nowrap;transition:opacity .15s}.tip.on{opacity:1}
.toast{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1}
.orient{font-size:12.5px;color:var(--ink2);text-align:center;margin-top:4px}
.kl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 18px}
.k{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-weight:700;font-size:13px;line-height:1.2;text-align:center;position:relative}
.k .ki{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center}.k .ki svg{width:19px;height:19px;fill:none;stroke:var(--cy);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.k[aria-checked=true]{border-color:var(--ink);background:var(--ink);color:#fff}.k[aria-checked=true] .ki{background:var(--sun)}.k[aria-checked=true] .ki svg{stroke:var(--ink)}
.k .ud{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%}.k .u2{background:var(--sun)}.k .u3{background:#d0573a}
.res{border-radius:18px;background:#f7f6f0;padding:18px}
.res.empty p{font-size:14px;color:var(--ink2);margin-top:8px}.res.empty b{display:block;color:var(--ink)}
.skl{height:12px;border-radius:6px;background:#e9e6dc;margin:8px 0}
.gbtn{margin-top:12px;border-radius:999px;background:#e3e0d5;color:#8c8a80;text-align:center;padding:12px;font-weight:700;font-size:14px}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rk{font:700 11.5px var(--bf);letter-spacing:.14em;color:var(--ink2)}
.urg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:#fff}.urg i{width:8px;height:8px;border-radius:50%;background:var(--green)}.urg.u2 i{background:var(--sun)}.urg.u3 i{background:#d0573a}.urg.u3{color:#a33b20}
.res h3{margin:8px 0 6px;outline:none}.res .ex{font-size:14.5px;color:var(--ink2)}
.rteeth{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.rteeth span{font-size:11.5px;background:#fff;border-radius:999px;padding:2px 9px;font-weight:600}
.rtl{font:700 12.5px var(--bf);margin:12px 0 6px}
.tl{list-style:none;margin:0;padding:0;font-size:14px}.tl li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed #dcd8cb}.tl li span:last-child{font-weight:700;text-align:right}.tl em{font-style:normal;color:var(--ink2);font-weight:600}
.est{font-size:12.5px;color:var(--ink2);margin:8px 0 12px}
.bubh{display:flex;justify-content:space-between;align-items:center}.bubh label{font-weight:700;font-size:13px}
.mrst{border:0;background:none;text-decoration:underline;font-size:12.5px;cursor:pointer;min-height:36px}
textarea.bub{width:100%;border:1.5px solid var(--line);border-radius:14px 14px 14px 4px;background:#e7f7ee;padding:10px 12px;font:14.5px/1.5 var(--bf);resize:vertical;min-height:84px}
.pref{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-size:13px;font-weight:600}
.pref button,.bsel button{border:1.5px solid var(--line);background:#fff;border-radius:999px;min-height:40px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer}
.pref button[aria-pressed=true],.bsel button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.bsel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;font-weight:600;margin:4px 0 12px}
.ract{display:flex;flex-wrap:wrap;gap:8px}
.copy{border:1.5px solid var(--line);background:#fff;border-radius:999px;min-height:48px;padding:0 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.disc{font-size:12px;color:var(--ink2);margin-top:12px}
@media(max-width:900px){.console{grid-template-columns:1fr}.kl{grid-template-columns:repeat(4,1fr)}}
@media(max-width:520px){.kl{grid-template-columns:repeat(2,1fr)}.k{flex-direction:row;justify-content:flex-start;min-height:52px;padding:8px 10px;text-align:left}.cl,.cr{padding:16px}.ps em{font-size:12.5px}.ps{padding:6px 8px;gap:6px}.ps i{width:22px;height:22px}}
/* services */
.sv{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.svc{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.svc::before{content:"";position:absolute;left:22px;top:0;width:54px;height:5px;border-radius:0 0 6px 6px;background:var(--c,var(--green))}
.svc .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--cs,var(--soft));color:var(--c,var(--cy))}
.svc .ic svg{width:26px;height:26px}
.svc p{font-size:14.5px;color:var(--ink2);flex:1}
.pr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--ink2);flex-wrap:wrap}.pr b{font:800 16px var(--hf);color:var(--ink)}
.svc a{font-weight:700;font-size:14px;color:var(--cy);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.pnote{margin-top:16px;font-size:13.5px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start}
@media(max-width:900px){.sv{grid-template-columns:1fr 1fr}}@media(max-width:560px){.sv{grid-template-columns:1fr}}
/* palet senyum */
#palet{background:var(--ink);color:#eef6f1}
#palet .lead{color:#b8cbc4}#palet h2{color:#fff}#palet .note{color:var(--sun)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pbox{background:#24363a;border-radius:var(--r);padding:22px}
#palet .step{color:var(--mint)}
.crayons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cray{display:flex;align-items:center;gap:10px;border:1.5px solid #3a4f52;background:#1d2e31;border-radius:14px;padding:10px 12px;min-height:56px;cursor:pointer;text-align:left;color:#eef6f1}
.cray .sw{width:14px;height:34px;border-radius:7px;background:var(--c);flex:none;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}

 '<rect x="110" y="96" width="180" height="46" rx="10" fill="#fff" stroke="#1d2b2a" stroke-width="1.5"/><g transform="translate(118 99) scale(.4)" fill="none" stroke-width="7.5" stroke-linecap="round"><path d="M19 45C15 31 25 20 38 22C44 23 48 27 50 31" stroke="#f2c230"/><path d="M18.5 54C19.5 65 23 75 28 83" stroke="#3a86c8"/><path d="M57 27C63 21 77 20 82.5 31C87 41 83 54 80 66C78 74 76 79 72.5 84" stroke="#1ea37a"/><path d="M38 60C40.5 73 59.5 73 62 60" stroke="#2f9e8f"/></g>'+
 '<text x="166" y="124" font-family="Sora,Arial" font-weight="800" font-size="22" fill="#33393e">KEVA</text><text x="226" y="124" font-family="Sora,Arial" font-weight="600" font-size="8" fill="#1e9470">DENTAL CARE</text><text x="200" y="137" text-anchor="middle" font-family="Manrope,Arial" font-weight="700" font-size="8" letter-spacing="2" fill="#1d2b2a">'+nm+'</text>'+
 '<rect x="96" y="158" width="70" height="60" fill="#cfe6f5" stroke="#1d2b2a" stroke-width="1.5"/><rect x="234" y="158" width="70" height="60" fill="#cfe6f5" stroke="#1d2b2a" stroke-width="1.5"/><rect x="176" y="160" width="48" height="90" fill="#9fd3bd" stroke="#1d2b2a" stroke-width="1.5"/>'+
 '<g fill="none" stroke-width="10" stroke-linecap="round" opacity=".9"><path d="M300 60A40 40 0 0 1 380 60" stroke="#f2c230"/><path d="M312 60A28 28 0 0 1 368 60" stroke="#3a86c8"/><path d="M324 60A16 16 0 0 1 356 60" stroke="#1ea37a"/></g></svg>'}
function buildLoc(full){const B=BR[lb];
  if(full){$("#btabs").innerHTML=BR.map((b,i)=>'<button type="button" role="tab" aria-selected="'+(i===lb)+'" data-b="'+i+'">'+ic("pin")+b.name+'</button>').join("");

    $("#vfoto").innerHTML=facade(lb);$("#vcap").textContent=lb?t("cap_d"):t("cap_c");setView(view)}
  const s=stat(lb);$("#lst").className="lst "+s.c;$("#lst span").textContent=s.tx;
  const {day}=wib();
  $("#hrs").innerHTML=B.hrs?[1,2,3,4,5,6,0].map(d=>'<tr class="'+(d===day?"today":"")+'"><td>'+t("daysF")[d]+'</td><td>'+hh(B.hrs[d][0])+'–'+hh(B.hrs[d][1])+'</td></tr>').join(""):'<tr><td>'+t("na_hrs")+'</td></tr>';
  $("#adr").innerHTML=B.addr?B.addr+' <span class="chk">'+t("chk")+'</span>':t("na_adr")+' <span class="chk">'+t("chk")+'</span>';
  const q=encodeURIComponent(B.q);$("#lgm").href="https://www.google.com/maps/search/?api=1&query="+q;$("#lwz").href="https://waze.com/ul?q="+q+"&navigate=yes";
  $("#lwa").href=wa((L==="id"?"Halo "+B.name+", boleh minta petunjuk arah ke klinik? Terima kasih.":"Hello "+B.name+", could you share directions to the clinic? Thank you."),lb);
  $("#lcp").style.display=B.addr?"":"none"}
function setView(v){view=v;$$(".vtabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  const foto=v==="foto";$("#vfoto").hidden=!foto;$("#vcap").hidden=!foto;$("#vpane").hidden=foto;
  const B=BR[lb],src="https://maps.google.com/maps?q="+encodeURIComponent(B.q)+"&z=16&output=embed";
  $("#vfull").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(B.q);
  if(!foto&&mapOk){Object.keys(panes).forEach(k=>panes[k].style.display=+k===lb?"block":"none");
    if(!panes[lb]){const d=document.createElement("div");d.style.cssText="position:absolute;inset:0";const f=document.createElement("iframe");f.src=src;f.loading="lazy";f.title="Peta "+B.name;f.referrerPolicy="no-referrer-when-downgrade";f.allowFullscreen=true;d.appendChild(f);$("#vpane").appendChild(d);panes[lb]=d}}}
$$(".vtabs button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
let mapOk=false;new IntersectionObserver(([e],o)=>{if(e.isIntersecting){mapOk=true;setView(view);o.disconnect()}},{rootMargin:"300px"}).observe($("#viewer"));
$("#lcp").onclick=()=>copyText(BR[lb].addr||"",()=>{const s=$("#lcp span");s.textContent=t("copied_a");setTimeout(()=>s.textContent=t("cp_a"),1600)});

  $$("#fq .q button").forEach((b,i)=>b.onclick=()=>{openQ=openQ===i?-1:i;$$("#fq .q").forEach((q,j)=>{q.classList.toggle("open",j===openQ);q.querySelector("button").setAttribute("aria-expanded",j===openQ)})})}

const fab=$("#fab");let heroV=true,cekV=false,closeV=false,infoV=false;
function fabOpen(o){fab.classList.toggle("open",o);$("#fabb").setAttribute("aria-expanded",o)}
$("#fabb").onclick=()=>fabOpen(!fab.classList.contains("open"));

const vis=(x,fn)=>new IntersectionObserver(([e])=>{fn(e.isIntersecting);fabUpd()}).observe(x);
vis($("#ctas"),v=>heroV=v);vis($("#cek .console"),v=>cekV=v);vis($("#close"),v=>closeV=v);vis($("#lokasi .info"),v=>infoV=v);

applyLang();setInterval(status,60000);

$$(".rv").forEach(e=>io.observe(e));

</script>
<script>
addEventListener("load",()=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";s.onload=init3d;s.onerror=()=>{};document.head.appendChild(s)});
function init3d(){
  const stage=document.getElementById("stage");let R;
  try{R=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){return}
  R.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(R.domElement);document.getElementById("fb").style.display="none";document.getElementById("zap").classList.add("on");
  const badge=stage.querySelector(".badge");if(badge)badge.style.display="none";
  const cv=R.domElement;cv.style.touchAction="pan-y";cv.style.cursor="grab";
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,.1,100);cam.position.set(0,.15,9.4);
  const TAU=Math.PI*2,v=new THREE.Vector3(),rnd=(a,b)=>a+Math.random()*(b-a);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- tooth (faceted, like the logo) ---------- */
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3,metalness:.04,flatShading:false});
  const edge=new THREE.LineBasicMaterial({color:0x1d2b2a,transparent:true,opacity:.12});
  const tooth=new THREE.Group();
  function addFaceted(geo,pos,rot){const m=new THREE.Mesh(geo,mat);m.position.copy(pos);if(rot)m.rotation.z=rot;tooth.add(m);const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo,1),edge);e.position.copy(pos);if(rot)e.rotation.z=rot;tooth.add(e)}
  const cg=new THREE.SphereGeometry(1.2,28,20),p=cg.attributes.position;
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);v.x*=1.05;v.z*=.9;if(v.y>0){const r=Math.hypot(v.x,v.z),th=Math.atan2(v.z,v.x);v.y=v.y*.75+.2*Math.cos(4*th)*(r/1.2)-.3*Math.max(0,1-r/.7)}else v.y*=.55;p.setXYZ(i,v.x,v.y,v.z)}
  cg.computeVertexNormals();addFaceted(cg,new THREE.Vector3(0,.6,0));
  [-1,1].forEach(sd=>{const rg=new THREE.ConeGeometry(.45,1.9,18,4,true);rg.rotateX(Math.PI);addFaceted(rg,new THREE.Vector3(sd*.47,-.65,0),sd*.12)});
  tooth.rotation.set(.2,-.4,0);tooth.scale.setScalar(1.08);sc.add(tooth);

  /* ---------- Atabara shield: text ring + orbiting logo emblem ---------- */
  const RING=2.0,SHIELD=2.08;
  const ring=new THREE.Group();ring.rotation.set(.32,0,-.14);sc.add(ring);
  function bandTexture(){
    const c=document.createElement("canvas");c.width=2048;c.height=96;const x=c.getContext("2d");
    x.font="800 44px 'Sora', Arial, Helvetica, sans-serif";x.fillStyle="#1d2b2a";x.textBaseline="middle";
    const unit="KEVA DENTAL CARE   ●   THE COLORS OF YOUR SMILE   ●   ";
    const w=x.measureText(unit).width,n=Math.max(1,Math.round(c.width/w)),sx=c.width/(w*n);
    x.save();x.scale(sx,1);for(let i=0;i<n;i++)x.fillText(unit,i*w,c.height/2+2);x.restore();
    [["#f2c230",0],["#3a86c8",.33],["#1ea37a",.66]].forEach(([col,o])=>{x.fillStyle=col;x.fillRect(o*c.width,4,c.width*.3,4);x.fillRect(o*c.width+c.width*.02,c.height-8,c.width*.3,4)});
    const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;t.anisotropy=4;return t}
  const bandGeo=new THREE.CylinderGeometry(RING,RING,.3,160,1,true);
  const bandFront=new THREE.MeshBasicMaterial({transparent:true,side:THREE.FrontSide,depthWrite:false});
  const bandBack=new THREE.MeshBasicMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,opacity:.22});
  const bandF=new THREE.Mesh(bandGeo,bandFront),bandB=new THREE.Mesh(bandGeo,bandBack);ring.add(bandB,bandF);
  const setBand=()=>{const t=bandTexture();bandFront.map=t;bandBack.map=t;bandFront.needsUpdate=bandBack.needsUpdate=true};
  setBand();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(setBand);
  // logo emblem riding the ring
  const logoImg=new Image(),logoTex=new THREE.Texture(logoImg);
  logoImg.onload=()=>{const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d");g.fillStyle="#fff";g.beginPath();g.arc(256,256,250,0,7);g.fill();g.drawImage(logoImg,56,56,400,400);logoTex.image=c;logoTex.needsUpdate=true};
  logoImg.src=(document.querySelector(".brand img")||{}).src||"";
  const emblem=new THREE.Sprite(new THREE.SpriteMaterial({map:logoTex,transparent:true}));emblem.scale.set(.95,.95,1);ring.add(emblem);
  // faint protective shell + ripples where bacteria are stopped
  const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(SHIELD,1),new THREE.MeshBasicMaterial({color:0x1ea37a,wireframe:true,transparent:true,opacity:.035,depthWrite:false}));sc.add(shell);
  const ripples=[];const rippleGeo=new THREE.RingGeometry(.12,.17,40);
  function ripple(pt){const m=new THREE.Mesh(rippleGeo,new THREE.MeshBasicMaterial({color:0x1ea37a,transparent:true,opacity:.9,side:THREE.DoubleSide,depthWrite:false}));
    m.position.copy(pt).setLength(SHIELD);m.lookAt(pt.clone().multiplyScalar(2));m.userData.t=0;sc.add(m);ripples.push(m);flash=1}
  let flash=0;

  /* ---------- bacteria ---------- */
  const ink=new THREE.MeshStandardMaterial({color:0x2a3b3a,roughness:.45,metalness:.1,flatShading:true});
  const gold=new THREE.MeshStandardMaterial({color:0xf2c230,roughness:.4,metalness:.1,flatShading:true});const sky=new THREE.MeshStandardMaterial({color:0x3a86c8,roughness:.4,metalness:.1,flatShading:true});
  const ball=(r,m)=>new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),m);
  const tube=(pts,r,m,seg)=>new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),seg||40,r,5,false),m);
  const MAKERS=[
    m=>{const g=new THREE.Group();g.add(ball(.17,m));for(let i=0;i<8;i++){const a=i/8*TAU,s=ball(.03,gold);s.position.set(Math.cos(a)*.19,Math.sin(a)*.19,0);g.add(s)}return g}, // coccus with pili
    m=>{const g=new THREE.Group();[-.11,.11].forEach(x=>{const b=ball(.12,m);b.position.x=x;b.scale.set(.9,1.05,1);g.add(b)});return g}, // diplococcus
    m=>{const g=new THREE.Group();for(let i=0;i<5;i++){const b=ball(.085,m);b.position.set(i*.16-.32,Math.sin(i*1.1)*.07,0);g.add(b)}return g}, // streptococcus chain
    m=>{const g=new THREE.Group();[[0,0,0],[.13,.05,0],[-.12,.07,.04],[.02,.15,-.05],[.07,-.12,.05],[-.08,-.1,-.04],[.14,-.03,-.08]].forEach(q=>{const b=ball(.075,m);b.position.set(...q);g.add(b)});return g}, // staphylococcus
    m=>{const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.32,8),m);body.rotation.z=Math.PI/2;g.add(body);[-.16,.16].forEach(x=>{const c=ball(.08,m);c.position.x=x;g.add(c)});
      const pts=[];for(let i=0;i<=12;i++)pts.push(new THREE.Vector3(.22+i*.045,Math.sin(i*1.1)*.05,0));g.add(tube(pts,.012,gold,30));return g}, // bacillus + flagellum
    m=>{const pts=[];for(let i=0;i<=40;i++){const t=i/40;pts.push(new THREE.Vector3((t-.5)*.7,Math.cos(t*TAU*2.5)*.08,Math.sin(t*TAU*2.5)*.08))}return tube(pts,.035,m,80)}, // spirillum
    m=>{const g=new THREE.Group();const pts=[];for(let i=0;i<=10;i++){const a=-.9+i*.18;pts.push(new THREE.Vector3(Math.cos(a)*.22,Math.sin(a)*.22,0))}g.add(tube(pts,.06,m,24));
      const f=[];for(let i=0;i<=10;i++)f.push(new THREE.Vector3(.14+i*.03,-.2-i*.035,Math.sin(i)*.03));g.add(tube(f,.01,gold,20));return g} // vibrio
  ];
  const bugs=[];
  function spawn(b,first){const a=rnd(0,TAU),r=first?rnd(2.6,3.1):3.4;b.position.set(Math.cos(a)*r,rnd(-1.5,1.6),Math.sin(a)*r*.45);
    b.userData.v=new THREE.Vector3(-b.position.x,-b.position.y*.5,-b.position.z).setLength(rnd(.25,.45));b.userData.spin=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1));b.userData.dead=0;b.visible=true;b.scale.setScalar(first?1:.01);b.userData.grow=first?1:0}
  const N=innerWidth<700?7:10;
  for(let i=0;i<N;i++){const b=MAKERS[i%MAKERS.length]([ink,sky,ink,gold][i%4]);b.traverse(o=>{if(o.isMesh)o.userData.bug=b});sc.add(b);bugs.push(b);spawn(b,true)}
  // debris from a cleared bacterium
  const bits=[];const bitGeo=new THREE.TetrahedronGeometry(.045);
  function burst(pt){for(let i=0;i<10;i++){const m=new THREE.Mesh(bitGeo,i%2?gold:ink);m.position.copy(pt);m.userData.v=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).setLength(rnd(1.2,2.4));m.userData.t=0;sc.add(m);bits.push(m)}}

  /* ---------- lights ---------- */
  sc.add(new THREE.HemisphereLight(0xffffff,0xd6ece0,.95));
  const k=new THREE.DirectionalLight(0xffffff,.9);k.position.set(3,4,5);sc.add(k);
  const g2=new THREE.PointLight(0x87d4b8,.9,14);g2.position.set(-3,-1,3);sc.add(g2);
  function size(){const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}size();addEventListener("resize",size);

  /* ---------- interaction: drag to spin, tap bacteria to clear ---------- */
  let mx=0,my=0,vis=true,drag=null,yaw=0,pitch=0,vy=0,cleared=0;
  const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
  const zap=document.getElementById("zapc");
  function hit(e){const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,cam);
    const h=ray.intersectObjects(bugs.filter(b=>b.visible&&!b.userData.dead),true)[0];return h&&h.object.userData.bug}
  addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
  cv.addEventListener("pointermove",e=>{if(drag){const dx=e.clientX-drag.x;drag.moved+=Math.abs(dx);vy=dx*.012;yaw+=vy;drag.x=e.clientX;return}cv.style.cursor=hit(e)?"pointer":"grab"});
  cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,moved:0};cv.style.cursor="grabbing"});
  cv.addEventListener("pointercancel",()=>{drag=null;cv.style.cursor="grab"});
  addEventListener("pointerup",e=>{if(!drag)return;const d=drag;drag=null;cv.style.cursor="grab";
    if(d.moved<6&&e.target===cv){const b=hit(e);if(b){b.userData.dead=1;burst(b.getWorldPosition(new THREE.Vector3()));b.visible=false;cleared++;if(zap){zap.textContent=cleared;zap.parentNode.classList.remove("pop");void zap.offsetWidth;zap.parentNode.classList.add("pop")}
      setTimeout(()=>spawn(b,false),1600)}}});
  new IntersectionObserver(([e])=>vis=e.isIntersecting).observe(stage);

  /* ---------- loop ---------- */
  const clk=new THREE.Clock();let emA=0;
  (function loop(){requestAnimationFrame(loop);if(!vis)return;const dt=Math.min(clk.getDelta(),.05),tt=clk.elapsedTime,s=Math.min(scrollY/600,1.2);
    if(!reduce){
      if(!drag){yaw+=vy;vy*=.94}
      tooth.rotation.y+=((-.4+tt*.3+s*2.4+mx*.8+yaw)-tooth.rotation.y)*.08;tooth.rotation.x+=((.2+my*.5)-tooth.rotation.x)*.06;tooth.position.y=Math.sin(tt*1.1)*.1;
      ring.rotation.y-=dt*.35;emA+=dt*.55;
      bandFront.map&&(bandFront.map.offset.x=(bandFront.map.offset.x+dt*.01)%1);
      emblem.position.set(Math.cos(emA)*(RING+.02),0,Math.sin(emA)*(RING+.02));
      const inFront=emblem.getWorldPosition(v).z>0;emblem.material.opacity+=((inFront?1:.35)-emblem.material.opacity)*.15;
      shell.rotation.y+=dt*.05;
      bugs.forEach(b=>{if(b.userData.dead&&!b.visible)return;const u=b.userData;
        if(u.grow<1){u.grow=Math.min(1,u.grow+dt*1.5);b.scale.setScalar(Math.max(.01,u.grow))}
        // drift toward the tooth with a little wander
        if(u.cool>0)u.cool-=dt;v.copy(b.position).negate().setLength(.09*dt);u.v.add(v);u.v.x+=Math.sin(tt*1.3+b.id)*.004;u.v.y+=Math.cos(tt*1.1+b.id)*.004;
        u.v.clampLength(.12,.55);b.position.addScaledVector(u.v,dt);
        const d=b.position.length();
        if(d<SHIELD+.18){const n=b.position.clone().normalize();u.v.reflect(n).addScaledVector(n,.35);b.position.copy(n.multiplyScalar(SHIELD+.2));if(!(u.cool>0)){ripple(b.position.clone());u.cool=1.6}}
        if(d>3.8)spawn(b,false);
        b.rotation.x+=u.spin.x*dt;b.rotation.y+=u.spin.y*dt;b.rotation.z+=u.spin.z*dt});
    }else{emblem.position.set(0,0,RING+.02)}
    for(let i=ripples.length-1;i>=0;i--){const m=ripples[i];m.userData.t+=dt;const q=m.userData.t/.8;m.scale.setScalar(1+q*4);m.material.opacity=.9*(1-q);if(q>=1){sc.remove(m);m.material.dispose();ripples.splice(i,1)}}
    for(let i=bits.length-1;i>=0;i--){const m=bits[i];m.userData.t+=dt;m.position.addScaledVector(m.userData.v,dt);m.userData.v.multiplyScalar(.93);m.rotation.x+=.2;m.scale.setScalar(Math.max(.01,1-m.userData.t/.9));if(m.userData.t>.9){sc.remove(m);bits.splice(i,1)}}
    flash*=.9;shell.material.opacity=.035+flash*.1;
    R.render(sc,cam)})();
}
