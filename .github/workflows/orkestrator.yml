# ORKESTRATOR — satu robot terjadwal (tiap 30 menit) menggantikan codex-check, bus-pull, revisi-pull.
# Hemat menit GitHub Actions. Urutan: cek hasil Codex → bus GPT → revisi → pencari klinik → kirim rakit.
name: orkestrator
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:
permissions: { contents: write, pull-requests: write, issues: write, actions: write }
concurrency: orkestrator
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q jsonschema pyyaml google-api-python-client google-auth && curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Konfigurasi rclone
        env: { RCLONE_DRIVE_TOKEN: "${{ secrets.RCLONE_DRIVE_TOKEN }}", RCLONE_CLIENT_ID: "${{ secrets.RCLONE_CLIENT_ID }}", RCLONE_CLIENT_SECRET: "${{ secrets.RCLONE_CLIENT_SECRET }}" }
        run: python3 scripts/bus.py rclone-conf
      - name: 0 · Jembatan Claude (perintah dari Drive → repo, variable, workflow)
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_PAT }}
          D: "08 Perintah Claude (repo)"
        run: |
          [ -n "$GH_TOKEN" ] || { echo "secret CLAUDE_PAT belum ada — jembatan dilewati"; exit 0; }
          mkdir -p /tmp/perintah /tmp/jb
          rclone lsjson "bus:$D" -M --files-only > /tmp/pl.json 2>/dev/null || { echo "folder perintah belum ada"; exit 0; }
          python3 - > /tmp/pnames.txt <<'PY'
          import json
          for f in json.load(open("/tmp/pl.json")):
              own = (f.get("Metadata") or {}).get("owner", "")
              if own and own.lower() != "kudakuda9292@gmail.com":
                  continue  # hanya perintah dari akun pemilik
              print(f["Name"])
          PY
          [ -s /tmp/pnames.txt ] || { echo "tidak ada perintah baru"; exit 0; }
          while IFS= read -r n; do rclone copyto "bus:$D/$n" "/tmp/perintah/$n" --drive-export-formats txt; done < /tmp/pnames.txt
          python3 scripts/jembatan.py terapkan /tmp/perintah
          git config user.name "maxigrowth-bot"; git config user.email "bot@maxigrowthstudio.com"
          git add -A -- . ':!dist'
          if ! git diff --cached --quiet; then
            git commit -q -F /tmp/jb/pesan.txt
            git -c http.https://github.com/.extraheader= push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
            git rev-parse HEAD > /tmp/jb/commit.txt
          fi
          while IFS=$'\t' read -r k v; do [ -n "$k" ] && gh variable set "$k" --body "$v"; done < /tmp/jb/vars.tsv
          while IFS= read -r r; do
            [ -n "$r" ] || continue
            wf=$(echo "$r" | python3 -c "import json,sys;print(json.load(sys.stdin)['workflow'])")
            args=$(echo "$r" | python3 -c "import json,sys;print(' '.join('-f %s=%s' % kv for kv in (json.load(sys.stdin).get('input') or {}).items()))")
            gh workflow run "$wf" $args || true
          done < /tmp/jb/runs.jsonl
          TS=$(date -u +%Y%m%d-%H%M)
          while IFS= read -r n; do rclone moveto "bus:$D/$n" "bus:99 Arsip/${TS}_perintah_$n" || true; done < /tmp/pnames.txt
      - name: 1 · Cek hasil Codex (merge / minta perbaikan)
        env:
          GH_TOKEN: ${{ github.token }}
          PAT_A: ${{ secrets.CODEX_PAT_A }}
          PAT_B: ${{ secrets.CODEX_PAT_B }}
          CODEX_PAT_A: ${{ secrets.CODEX_PAT_A }}
          CODEX_PAT_B: ${{ secrets.CODEX_PAT_B }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "maxigrowth-bot"; git config user.email "bot@maxigrowthstudio.com"
          cp -r scripts /tmp/scripts-main     # pakai skrip pengecek versi main, bukan versi di branch PR
          mkdir -p /tmp/data && cp data/codex-pool*.json /tmp/data/ 2>/dev/null || true   # skrip di /tmp/scripts-main membaca /tmp/data
          gh pr list --state open --limit 50 --json number,headRefName,headRefOid \
            -q '.[] | select(.headRefName | startswith("codex/")) | "\(.number) \(.headRefName) \(.headRefOid)"' > prs.txt
          cat prs.txt
          while read -r PR BR SHA; do
            [ -z "$PR" ] && continue
            echo "::group::PR #$PR ($BR @ ${SHA:0:7})"
            if gh pr view $PR --json comments -q '.comments[].body' | grep -q "codex-check sha=$SHA"; then
              echo "commit ini sudah diperiksa, lewati"; echo "::endgroup::"; continue
            fi
            git fetch -q origin "$BR" && git checkout -q -f "origin/$BR"
            git diff --name-only origin/main...HEAD > changed.txt
            eval "$(python /tmp/scripts-main/codex_check.py detect changed.txt | sed 's/^/S_/')"
            if [ "$S_stage" = "none" ]; then echo "belum ada hasil Codex"; git checkout -q -f origin/main; echo "::endgroup::"; continue; fi
            cp -r /tmp/scripts-main/. scripts/
            set +e; python scripts/codex_check.py check "$S_dir" "$S_stage" > check.out 2>&1; code=$?; set -e
            cat check.out
            [ $code -ne 0 ] && python3 /tmp/scripts-main/belajar.py catat "$S_stage" check.out "${S_dir#batches/}" || true
            # slot Codex dari pool (cek fakta menghindari slot A supaya pemeriksa beda akun)
            SL=$(python3 /tmp/scripts-main/codex_pool.py pilih $([ "$S_stage" = "cekfakta" ] && echo A))
            SLID=${SL%% *}; SEC=${SL#* }; [ -n "$SL" ] || SEC=CODEX_PAT_A; PAT=${!SEC:-$PAT_A}
            JOB=${S_dir#batches/}
            if [ $code -ne 0 ]; then
              n=$(gh pr view $PR --json comments -q '[.comments[].body | select(contains("codex-check sha="))] | length')
              if [ "$n" -ge 2 ]; then
                gh label create butuh-claude --color d93f0b 2>/dev/null || true
                gh pr edit $PR --add-label butuh-claude
                gh pr comment $PR --body "<!-- codex-check sha=$SHA -->
          Sudah 2x diperbaiki Codex tapi masih gagal. Menunggu review Claude.
          \`\`\`
          $(tail -40 check.out)
          \`\`\`"
              elif [ -z "$SL" ]; then
                echo "semua slot Codex habis kuota — permintaan perbaikan ditunda ke run berikutnya"
              else
                GH_TOKEN=$PAT gh pr comment $PR --body "<!-- codex-check sha=$SHA --><!-- slot=${SLID:-A} t=$(date -u +%Y-%m-%dT%H:%M:%SZ) -->
          @codex Cek otomatis GAGAL. Perbaiki file di \`$S_dir\`, jalankan \`python scripts/codex_check.py check $S_dir $S_stage\` sampai LULUS, lalu commit dan \`git push origin HEAD:$BR\`.
          \`\`\`
          $(tail -40 check.out)
          \`\`\`"
              fi
            else
              gh pr comment $PR --body "<!-- codex-check sha=$SHA --> Cek otomatis LULUS — merge."
              python3 /tmp/scripts-main/belajar.py lulus "$S_stage" "$JOB" || true
              gh pr ready $PR 2>/dev/null || true
              GH_TOKEN=$PAT_A gh pr merge $PR --squash --delete-branch
              git fetch -q origin main && git checkout -q -f -B main origin/main
              cp -r /tmp/scripts-main/. scripts/
              python scripts/codex_check.py finish "$S_dir" "$S_stage"
              git add "$S_dir" && git commit -q -m "codex-check: $JOB $S_stage lulus" || true
              git remote set-url origin "https://x-access-token:${PAT_A}@github.com/${REPO}.git"
              for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
              git remote set-url origin "https://github.com/${REPO}.git"
              ISSUE=$(gh issue list --state open --limit 200 --json number,title -q ".[] | select(.title | startswith(\"[$JOB]\")) | .number" | head -1)
              case "$S_stage" in
                riset)    gh workflow run codex-dispatch.yml -f job="$JOB" -f tugas=cekfakta -f issue="$ISSUE" ;;
                cekfakta) [ -n "$ISSUE" ] && gh issue edit $ISSUE --remove-label riset --add-label siap-rakit || true ;;
                rakit)    [ -n "$ISSUE" ] && { gh issue comment $ISSUE --body "Preview dirakit Codex & lulus cek otomatis → **Siap review**: \`$S_dir/site/index.html\`"; gh issue edit $ISSUE --remove-label siap-rakit --add-label siap-review || true; } ;;
              esac
            fi
            git checkout -q -f origin/main 2>/dev/null || git checkout -q -f main
            echo "::endgroup::"
          done < prs.txt
          git fetch -q origin main && git checkout -q -f -B main origin/main
      - name: 1b · Codex pool — slot kena limit/gagal/diam → pindah ke akun lain
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_PAT_A: ${{ secrets.CODEX_PAT_A }}
          CODEX_PAT_B: ${{ secrets.CODEX_PAT_B }}
        run: |
          python3 scripts/codex_pool.py pindai || true
          [ -f /tmp/pool/aksi.tsv ] || exit 0
          while IFS=$'\t' read -r PR SL SEC F; do
            [ -n "$PR" ] || continue
            if [ "$F" = "butuh-claude" ]; then
              gh label create butuh-claude --color d93f0b 2>/dev/null || true
              gh pr edit "$PR" --add-label butuh-claude || true; continue
            fi
            GH_TOKEN="${!SEC}" gh pr comment "$PR" --body-file "$F" || true
          done < /tmp/pool/aksi.tsv
      - name: 2 · Bus GPT · Pindahkan hasil GPT dari root My Drive ke folder bus
        if: vars.RISET_ENGINE == 'bus'
        run: |
          F="--max-depth 1 --drive-server-side-across-configs -v"
          rclone move root: "bus:02 Hasil Riset" $F --include "B*-W*_riset.json*" --include "B*-W*_konten.json*" || true
          rclone move root: "bus:03 Hasil Cek Fakta" $F --include "B*-W*_cekfakta.json*" || true
      - name: 2f · Desain + fitur khas dari GPT-A (DESAIN-hasil-* / FITUR-hasil-* → desain.json / fitur.json, pelajaran #46 #52)
        run: |
          mkdir -p /tmp/desain
          rclone copy root: /tmp/desain --max-depth 1 --include "DESAIN-hasil-*" --include "FITUR-hasil-*" --drive-export-formats txt -v || true
          ls /tmp/desain | head -50
          python3 scripts/desain.py masuk /tmp/desain || true
          TS=$(date -u +%Y%m%d-%H%M)
          for f in /tmp/desain/DESAIN-hasil-* /tmp/desain/FITUR-hasil-*; do [ -f "$f" ] || continue; n=$(basename "$f"); rclone moveto "root:$n" "bus:99 Arsip/${TS}_$n" || true; done
      - name: 2 · Bus GPT · Unduh hasil GPT
        if: vars.RISET_ENGINE == 'bus'
        run: |
          rclone copy "bus:02 Hasil Riset" /tmp/bus/riset --drive-export-formats txt -v || true
          rclone copy "bus:03 Hasil Cek Fakta" /tmp/bus/cek --drive-export-formats txt -v || true
          mkdir -p /tmp/bus/riset /tmp/bus/cek; ls -la /tmp/bus/riset /tmp/bus/cek
      - name: 2 · Bus GPT · Cek + pasang ke repo
        if: vars.RISET_ENGINE == 'bus'
        run: python3 scripts/bus.py pull /tmp/bus/riset /tmp/bus/cek | tee bus.log
      - name: 2 · Bus GPT · Terapkan aksi di Drive
        if: vars.RISET_ENGINE == 'bus'
        run: |
          TS=$(date +%Y%m%d-%H%M)
          while read -r act a b c; do
            [ -z "$act" ] && continue
            if [ "$act" = "ARSIP" ]; then
              for pola in $a $b $c; do
                for src in "02 Hasil Riset" "03 Hasil Cek Fakta" "01 Antrean Riset"; do
                  rclone lsf "bus:$src" --drive-export-formats txt --include "$pola" | while read -r f; do
                    rclone moveto "bus:$src/$f" "bus:99 Arsip/${TS}_$f" --drive-export-formats txt -v || true
                  done
                done
              done
            elif [ "$act" = "RAKIT" ]; then
              echo "$a" >> /tmp/rakit.txt
            elif [ "$act" = "REVISI" ]; then
              B=${a%%-*}; W=${a#*-}
              { echo "SURAT TUGAS RISET — $B/$W (REVISI)"; cat "batches/$B/$W/job.json"; echo; cat "$b"; } > /tmp/surat.txt
              rclone copyto /tmp/surat.txt "bus:01 Antrean Riset/${a}_riset.txt" -v
            fi
          done < bus-actions.txt
      - name: 2d · Bus GPT · Sediakan riset hasil Codex untuk GPT-B (pelajaran #21)
        if: vars.RISET_ENGINE == 'bus'
        run: |
          # GPT-B hanya membaca "02 Hasil Riset" di Drive. Riset yang dikerjakan Codex (failover) tidak pernah masuk ke sana → GPT-B tidak melihatnya.
          for st in batches/B*/*/status.json; do
            d=$(dirname "$st"); [ -f "$d/riset.json" ] || continue
            grep -q '"Menunggu cek fakta"' "$st" || continue
            [ -f "$d/cekfakta.json" ] && continue
            k="$(basename "$(dirname "$d")")-$(basename "$d")"
            if rclone lsf "bus:02 Hasil Riset" --include "${k}_riset.json*" | grep -q .; then continue; fi
            if rclone lsf "bus:03 Hasil Cek Fakta" --include "${k}_cekfakta.json*" | grep -q .; then continue; fi
            rclone copyto "$d/riset.json" "bus:02 Hasil Riset/${k}_riset.json.md" -v || true
          done
      - name: 2e · Bus GPT · Pulihkan surat tugas yang hilang (pelajaran #23)
        if: vars.RISET_ENGINE == 'bus'
        run: |
          for st in batches/B*/*/status.json; do
            grep -q '"Riset di GPT"' "$st" || continue
            d=$(dirname "$st"); B=$(basename "$(dirname "$d")"); W=$(basename "$d"); k="$B-$W"
            [ -f "$d/job.json" ] || { echo "$k: tanpa job.json" >> /tmp/2e.log; continue; }
            if rclone lsf "bus:01 Antrean Riset" --include "${k}_riset*" | grep -q .; then echo "$k: surat sudah ada di 01" >> /tmp/2e.log; continue; fi
            if rclone lsf "bus:02 Hasil Riset" --include "${k}_riset.json*" | grep -q .; then echo "$k: riset ada di 02" >> /tmp/2e.log; continue; fi
            RT=$(rclone lsf root: --max-depth 1 --files-only --include "/${k}_riset.json*" 2>/dev/null || true)
            if [ -n "$RT" ]; then echo "$k: riset ada di root: $RT" >> /tmp/2e.log; continue; fi
            echo "$k: membuat surat" >> /tmp/2e.log
            {
              echo "SURAT TUGAS RISET — $B/$W (REVISI)"; cat "$d/job.json"; echo
              if [ -f "bus-notes/$k" ]; then cat "bus-notes/$k"; else
                echo "REVISI: riset sebelumnya tidak punya nomor WhatsApp, sehingga website tidak bisa dirakit. Cari nomor WA/telepon resmi klinik (situs, Google Maps, Instagram, Linktree, Halodoc/Alodokter) dan alamat bila kosong. Tidak ketemu = v null, src null (JANGAN menebak). Tulis ulang riset dan konten lengkap."
                C=$(git log --diff-filter=D -1 --format=%H -- "$d/riset.json" 2>/dev/null || true)
                if [ -n "$C" ]; then echo; echo "RISET LAMA:"; git show "$C^:$d/riset.json" || true; fi
              fi
            } > /tmp/surat-p.txt
            rclone copyto /tmp/surat-p.txt "bus:01 Antrean Riset/${k}_riset.txt" -v >> /tmp/2e.log 2>&1 || echo "$k: GAGAL upload" >> /tmp/2e.log
          done
      - name: 2c · R&D fitur · ide dari GPT → library/fitur (+ katalog ke Drive untuk GPT)
        run: |
          [ -f /tmp/2e.log ] || echo "2e: tidak ada klinik berstatus Riset di GPT" > /tmp/2e.log; rclone copyto /tmp/2e.log "bus:09 Laporan Robot/2e-log.txt" || true
          mkdir -p /tmp/bus/fitur; rm -f /tmp/fitur-arsip.txt
          rclone copy root: /tmp/bus/fitur --max-depth 1 --include "FITUR-*_ide.json*" --drive-export-formats txt -v || true
          python3 scripts/fitur.py pull /tmp/bus/fitur || echo "pull fitur error (tidak fatal)"
          if [ -s /tmp/fitur-arsip.txt ]; then
            while read -r act nama; do
              [ "$act" = "ARSIP" ] && rclone move root: "bus:99 Arsip" --max-depth 1 --include "$nama" --drive-server-side-across-configs -v || true
            done < /tmp/fitur-arsip.txt
          fi
          python3 scripts/fitur.py katalog || echo "katalog fitur error (tidak fatal)"
          rclone copyto library/fitur/KATALOG.md "bus:KATALOG-FITUR.md" -v || true
      - name: 2b · Loop belajar (kesalahan berulang → aturan pekerja) + uji regresi (aturan lama tetap jalan)
        run: |
          for f in bus-notes/*; do [ -f "$f" ] && python3 scripts/belajar.py catat riset-gpt "$f" "$(basename "$f")"; done || true
          python3 scripts/belajar.py gabung || true
          python3 scripts/belajar.py perbarui || true
          python3 scripts/belajar.py rapor > /dev/null || true
          A="bus:00 ATURAN KLINIK-BUS (baca tiap run)"
          if rclone copyto "$A" /tmp/aturan.txt --drive-export-formats txt 2>/dev/null && python3 scripts/belajar.py sisip /tmp/aturan.txt; then
            rclone copyto /tmp/aturan.txt "$A" || true
          fi
          python3 tests/uji_regresi.py || echo "::warning::uji regresi ada yang gagal (lihat laporan)"
      - name: 3 · Revisi dari chat · ambil
        id: r
        run: |
          mkdir -p /tmp/rev
          rclone copy "bus:04 Revisi (dari chat Claude)" /tmp/rev --include "B*-W*_revisi*" --drive-export-formats txt -v || true
          ls -la /tmp/rev
          TS=$(date -u +%Y%m%d-%H%M)
          : > /tmp/jobs.txt
          for f in /tmp/rev/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f"); key=${name%%_revisi*}; B=${key%%-*}; W=${key#*-}
            d="batches/$B/$W"
            if [ ! -f "$d/job.json" ]; then echo "job tidak ada: $d"; continue; fi
            mkdir -p "$d/revisi"; cp "$f" "$d/revisi/$TS.md"
            echo "$B/$W" >> /tmp/jobs.txt
            echo "$name" >> /tmp/done.txt
          done
          sort -u /tmp/jobs.txt -o /tmp/jobs.txt; cat /tmp/jobs.txt
      - name: 3b · Pencari via chat GPT (hasil CARI-* → sourcing/; daftar kota + known ke Drive; pelajaran #24)
        if: vars.RISET_ENGINE == 'bus'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: |
          rm -rf /tmp/cari-in /tmp/cari-arsip.txt; mkdir -p /tmp/cari-in
          rclone copy root: /tmp/cari-in --max-depth 1 --include "CARI-*_hasil.json*" --drive-export-formats txt -v || true
          python3 scripts/cari_chat.py ingest /tmp/cari-in || echo "ingest cari error (tidak fatal)"
          if [ -s /tmp/cari-selesai.txt ]; then
            TS2=$(date -u +%Y%m%d-%H%M)
            while read -r sf; do
              if [ -n "$sf" ]; then rclone moveto "bus:05 Antrean Cari/$sf" "bus:99 Arsip/${TS2}_$sf" -v || true; fi
            done < /tmp/cari-selesai.txt
          fi
          rm -rf /tmp/cari-surat
          python3 scripts/cari_chat.py surat /tmp/cari-surat || echo "surat cari error (tidak fatal)"
          if ls /tmp/cari-surat/*_cari.txt >/dev/null 2>&1; then rclone copy /tmp/cari-surat "bus:05 Antrean Cari" -v || true; fi
          if [ -s /tmp/cari-arsip.txt ]; then
            TS=$(date -u +%Y%m%d-%H%M)
            while read -r nama; do
              if [ -n "$nama" ]; then rclone moveto "root:$nama" "bus:99 Arsip/${TS}_$nama" -v || true; fi
            done < /tmp/cari-arsip.txt
          fi
          python3 scripts/sourcing.py apply || echo "apply sourcing error (tidak fatal)"
          python3 scripts/cari_chat.py kota > /tmp/kota-chat.txt || true
          python3 scripts/sourcing.py known || true
          rclone copyto /tmp/kota-chat.txt "bus:KOTA-BERIKUTNYA.txt" || true
          rclone copyto data/known.txt "bus:KNOWN-KLINIK.txt" || true
      - name: 4 · Pencari klinik
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: |
          python3 scripts/sourcing.py apply
          [ "$(cat data/sourcing-engine.txt 2>/dev/null)" = "gpt" ] && exit 0
          if gh pr list --state open --json headRefName -q '.[].headRefName' | grep -q '^codex/cari-'; then
            echo "pencarian kota sedang berjalan"; exit 0; fi
          NEXT=$(python3 scripts/sourcing.py next)
          [ -z "$NEXT" ] && exit 0
          IFS=$'\t' read -r SLUG KOTA NEGARA <<< "$NEXT"
          python3 scripts/sourcing.py known
          python3 scripts/sourcing.py mark-diminta "$SLUG"
          echo "$SLUG|$KOTA|$NEGARA" > /tmp/cari.txt
      - name: 4b · Intake otomatis (maks 200 klinik/hari, hanya bila klinik aktif < 30)
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: |
          N=$(INTAKE_AKTIF_MAKS=60 python3 scripts/auto_intake.py || echo 0)
          if [ "${N:-0}" -gt 0 ]; then gh workflow run intake.yml -f size="$N"; echo "intake $N klinik"; fi
      - name: 4c · Failover GPT → Codex (klinik tertahan di jalur GPT)
        if: vars.RISET_ENGINE == 'bus'
        run: |
          [ -n "$(python3 scripts/codex_pool.py pilih)" ] || { echo "semua slot Codex habis — failover ditunda"; exit 0; }
          python3 scripts/failover.py > /tmp/failover.txt || true
          # klinik yang dialihkan ke Codex: arsipkan surat tugas GPT supaya tidak dikerjakan dobel
          TS=$(date -u +%Y%m%d-%H%M)
          while IFS=$'\t' read -r job tg; do
            [ "$tg" = "riset" ] || continue
            key=$(echo "$job" | tr '/' '-')
            rclone lsf "bus:01 Antrean Riset" --include "${key}_riset*" 2>/dev/null | while read -r f; do
              rclone moveto "bus:01 Antrean Riset/$f" "bus:99 Arsip/${TS}_dialihkan-codex_$f" || true
            done
          done < /tmp/failover.txt
          cat /tmp/failover.txt
      - name: 5 · Commit perubahan
        run: |
          git config user.name "maxigrowth-bot"; git config user.email "bot@maxigrowthstudio.com"
          git add batches data library/fitur sourcing AGENTS.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "orkestrator: pembaruan otomatis"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
      - name: 5b · Sinkron status ke Sheet
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: |
          git pull -q --rebase origin main || true
          python3 scripts/sheet_sync.py || echo "sinkron Sheet gagal (lanjut)"
      - name: 6 · Kirim tugas ke Codex (cari / revisi / rakit)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -f /tmp/cari.txt ]; then
            IFS='|' read -r SLUG KOTA NEGARA < /tmp/cari.txt
            gh workflow run codex-dispatch.yml -f job="$SLUG" -f tugas=cari -f info="$KOTA|$NEGARA"
          fi
          if [ -s /tmp/failover.txt ]; then
            while IFS=$'\t' read -r job tg; do [ -n "$job" ] && gh workflow run codex-dispatch.yml -f job="$job" -f tugas="$tg"; sleep 3; done < /tmp/failover.txt
          fi
          if [ -s /tmp/jobs.txt ]; then
            while read -r job; do gh workflow run codex-dispatch.yml -f job="$job" -f tugas=revisi; sleep 3; done < /tmp/jobs.txt
          fi
          # Jalur hibrida: rakit TANPA AI dari template dulu (gratis, instan); yang gagal cek → baru Codex.
          if [ "${{ vars.RAKIT_ENGINE }}" = "hibrida" ] || [ "${{ vars.RAKIT_ENGINE }}" = "template" ]; then
            git config user.name "maxigrowth-bot"; git config user.email "bot@maxigrowthstudio.com"
            git pull -q --rebase origin main || true
            rm -f /tmp/wa-balik.txt; mkdir -p bus-notes
            python3 scripts/rakit_template.py --antre 200 2>&1 | tee /tmp/jb-template.txt || echo "rakit template error (lanjut)"
            # pelajaran #22: riset tanpa nomor WA → arsipkan file lama di Drive & kirim surat REVISI ke GPT-A
            if [ -s /tmp/wa-balik.txt ]; then
              while read -r key; do
                [ -z "$key" ] && continue
                TS=$(date +%Y%m%d-%H%M); B=${key%%-*}; W=${key#*-}
                for src in "02 Hasil Riset" "03 Hasil Cek Fakta" "01 Antrean Riset"; do
                  rclone lsf "bus:$src" --drive-export-formats txt --include "${key}_*" | while read -r f; do
                    rclone moveto "bus:$src/$f" "bus:99 Arsip/${TS}_$f" --drive-export-formats txt -v || true
                  done
                done
                { echo "SURAT TUGAS RISET — $B/$W (REVISI)"; cat "batches/$B/$W/job.json"; echo; cat "bus-notes/$key"; } > /tmp/surat.txt
                rclone copyto /tmp/surat.txt "bus:01 Antrean Riset/${key}_riset.txt" -v || true
              done < /tmp/wa-balik.txt
            fi
            # aturan: klinik yang sudah lulus template → PR rakit Codex yang masih terbuka ditutup (hemat kuota, tanpa konflik)
            grep '^✅' /tmp/jb-template.txt | awk '{print $2}' | while read -r job; do
              BR="codex/rakit-$(echo "$job" | tr '/' '-')"
              for n in $(gh pr list --head "$BR" --state open --json number -q '.[].number' 2>/dev/null); do
                gh pr close "$n" --comment "Ditutup otomatis: klinik ini sudah dirakit template tanpa AI & lulus cek." --delete-branch || true
              done
            done
            git add batches data bus-notes 2>/dev/null || true
            git diff --cached --quiet || { git commit -q -m "rakit template (tanpa AI)"; for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done; }
          fi
          case "${{ vars.RAKIT_ENGINE }}" in codex|hibrida) ;; *) exit 0 ;; esac
          # PR rakit yang macet >3 jam tanpa hasil Codex → tutup (dihitung 1x gagal) supaya bisa dikirim ulang
          CUT=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh pr list --state open --limit 100 --json number,headRefName,createdAt,commits,comments \
            -q ".[] | select(.headRefName | startswith(\"codex/rakit-\")) | select(([.comments[].createdAt] + [.createdAt] | max) < \"$CUT\") | select(([.commits[].messageHeadline] | map(startswith(\"tugas codex\") | not) | any) | not) | .number" \
            | while read -r n; do [ -n "$n" ] && gh pr close "$n" --comment "Ditutup otomatis: >3 jam tanpa hasil Codex. Akan dikirim ulang (maks 2x)." --delete-branch; done
          python3 scripts/bus.py pending-rakit 100 >> /tmp/rakit.txt || true
          [ -s /tmp/rakit.txt ] || exit 0
          OPEN=$(gh pr list --state open --limit 100 --json headRefName -q '.[].headRefName' | grep '^codex/rakit-' || true)
          JALAN=$(echo "$OPEN" | grep -c . || true)
          sort -u /tmp/rakit.txt | while read -r job; do
            [ -z "$job" ] && continue
            [ "$JALAN" -ge 5 ] && break
            BR="codex/rakit-$(echo "$job" | tr '/' '-')"
            echo "$OPEN" | grep -qx "$BR" && continue
            GAGAL=$(gh pr list --state closed --head "$BR" --limit 20 --json mergedAt,createdAt -q '[.[] | select(.mergedAt == null and .createdAt > "2026-09-30T00:00:00Z")] | length')
            if [ "${GAGAL:-0}" -ge 2 ]; then echo "SKIP $job: sudah $GAGAL kali gagal, butuh dicek"; continue; fi
            gh workflow run codex-dispatch.yml -f job="$job" -f tugas=rakit; JALAN=$((JALAN+1)); sleep 3
          done
      - name: 6c · R&D fitur · kirim fitur terpilih ke Codex (status "pilih" di data/fitur-pilihan.json)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git pull -q --rebase origin main || true
          for slug in $(python3 scripts/fitur.py kirim 2>/dev/null); do
            gh workflow run codex-dispatch.yml -f job="fitur/$slug" -f tugas=fitur && python3 scripts/fitur.py tandai "$slug" dikirim || true
            sleep 3
          done
          git config user.name "maxigrowth-bot"; git config user.email "bot@maxigrowthstudio.com"
          git add data/fitur-pilihan.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -q -m "fitur: dikirim ke Codex"; for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done; }
      - name: 7 · Revisi dari chat · arsipkan file di Drive
        run: |
          [ -f /tmp/done.txt ] || exit 0
          TS=$(date -u +%Y%m%d-%H%M)
          while read -r name; do
            rclone lsf "bus:04 Revisi (dari chat Claude)" --drive-export-formats txt --include "${name%.txt}*" | while read -r f; do
              rclone moveto "bus:04 Revisi (dari chat Claude)/$f" "bus:99 Arsip/${TS}_$f" --drive-export-formats txt -v || true
            done
          done < /tmp/done.txt
      - name: 8 · Deploy preview ke Cloudflare Pages + isi Link preview di Sheet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          PROYEK: maxigrowth-previews
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "secret Cloudflare belum ada — lewati"; exit 0; }
          git pull -q --rebase origin main || true
          NEW=$(python3 scripts/deploy_prep.py); OLD=$(cat data/deploy-hash.txt 2>/dev/null || true)
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROYEK"
          if ! curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" >/dev/null; then
            npx -y wrangler@4 pages project create "$PROYEK" --production-branch main
          fi
          if [ "$NEW" != "$OLD" ]; then
            npx -y wrangler@4 pages deploy dist --project-name "$PROYEK" --branch main --commit-dirty=true
            echo "$NEW" > data/deploy-hash.txt
          else
            echo "tidak ada preview baru — deploy dilewati"
          fi
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | python3 -c "import json,sys;print(json.load(sys.stdin)['result']['subdomain'])")
          PREVIEW_BASE="https://maxigrowthstudio.com" python3 scripts/sheet_sync.py links
          git config user.name "maxigrowth-bot"; git config user.email "bot@maxigrowthstudio.com"
          git add data/deploy-hash.txt data/preview-links.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -q -m "deploy preview"; for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done; }
      - name: 8c · Deploy ke maxigrowthstudio.com (worker) bila ada preview baru
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git pull -q --rebase origin main || true
          NEW=$(python3 scripts/deploy_prep.py || true); OLD=$(cat data/worker-deploy-hash.txt 2>/dev/null || true)
          [ -n "$NEW" ] && [ "$NEW" != "$OLD" ] || { echo "tidak ada perubahan preview — worker-deploy dilewati"; exit 0; }
          SIB=$(gh run list --workflow worker-deploy.yml --limit 1 --json status -q '.[0].status' 2>/dev/null || true)
          case "$SIB" in in_progress|queued|waiting|pending) echo "worker-deploy sedang jalan"; exit 0;; esac
          GAGAL=$(gh run list --workflow worker-deploy.yml --limit 3 --json conclusion -q '[.[]|select(.conclusion=="failure")]|length' 2>/dev/null || echo 0)
          [ "${GAGAL:-0}" -ge 3 ] && { echo "worker-deploy gagal 3x berturut — berhenti, perlu Claude"; exit 0; }
          gh workflow run worker-deploy.yml --ref main && echo "worker-deploy dipicu" || true
      - name: 8d · Catat outreach terkirim ke Sheet (data/outreach.json)
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: |
          [ -f data/outreach.json ] && { python3 scripts/sheet_sync.py outreach || echo "gagal mencatat outreach (tidak fatal)"; } || echo "belum ada data/outreach.json"
      - name: 8b · Batalkan perubahan Claude bila run ini gagal
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_PAT }}
        run: |
          [ -s /tmp/jb/commit.txt ] || exit 0
          C=$(cat /tmp/jb/commit.txt)
          # batalkan HANYA bila run sebelumnya sehat (kegagalan baru kemungkinan akibat perubahan Claude).
          # Kalau robot sudah gagal sebelum perubahan ini, perubahan Claude justru perbaikannya — jangan dibatalkan.
          PREV=$(gh run list --workflow orkestrator.yml --status completed --limit 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || true)
          if [ "$PREV" != "success" ]; then echo "- ⚠️ run gagal, tapi run sebelumnya juga gagal ($PREV) → perubahan Claude ${C:0:7} TIDAK dibatalkan" >> /tmp/jb/hasil.md; exit 0; fi
          git config user.name "maxigrowth-bot"; git config user.email "bot@maxigrowthstudio.com"
          git fetch -q origin main && git checkout -q -f -B main origin/main
          git revert --no-edit "$C" && git -c http.https://github.com/.extraheader= push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          echo "- ⏪ perubahan Claude ${C:0:7} DIBATALKAN otomatis karena run ini gagal" >> /tmp/jb/hasil.md
      - name: 9 · Laporan robot ke Drive (dibaca Claude)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_PAT || github.token }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: |
          # detak pekerja GPT (dari waktu file hasil yang mereka buat) untuk alarm "GPT diam"
          rclone lsjson "bus:02 Hasil Riset" --files-only > /tmp/jb/gpt_r1.json 2>/dev/null || echo "[]" > /tmp/jb/gpt_r1.json
          rclone lsjson "bus:99 Arsip" --files-only --include "*_riset.json*" > /tmp/jb/gpt_r2.json 2>/dev/null || echo "[]" > /tmp/jb/gpt_r2.json
          rclone lsjson "bus:03 Hasil Cek Fakta" --files-only > /tmp/jb/gpt_c1.json 2>/dev/null || echo "[]" > /tmp/jb/gpt_c1.json
          rclone lsjson "bus:99 Arsip" --files-only --include "*_cekfakta.json*" > /tmp/jb/gpt_c2.json 2>/dev/null || echo "[]" > /tmp/jb/gpt_c2.json
          rclone lsjson "bus:01 Antrean Riset" --files-only > /tmp/jb/gpt_antre.json 2>/dev/null || echo "[]" > /tmp/jb/gpt_antre.json
          python3 scripts/jembatan.py laporan > /dev/null || true
          [ -f /tmp/jb/laporan.md ] && rclone copyto /tmp/jb/laporan.md "bus:09 Laporan Robot/laporan-terakhir.md" || true
          for f in pelajaran PANDUAN-OPERASI; do [ -f docs/$f.md ] && rclone copyto docs/$f.md "bus:09 Laporan Robot/$f.md" || true; done
      - name: 9b · Eskalasi ke pemilik (hanya hal yang tidak bisa diperbaiki robot/Claude)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --label butuh-rizqi --json number -q '.[0].number' 2>/dev/null || true)
          if [ -s /tmp/jb/alarm-manusia.md ]; then
            [ -n "$NUM" ] && exit 0
            gh label create butuh-rizqi --color b60205 2>/dev/null || true
            { echo "@${{ github.repository_owner }} Robot butuh bantuanmu untuk hal yang tidak bisa diperbaiki otomatis:"; echo; cat /tmp/jb/alarm-manusia.md; echo; echo "Balas saja di chat Claude — Claude akan memandu langkahnya."; } > /tmp/esk.md
            gh issue create --title "🚨 Butuh bantuan pemilik" --label butuh-rizqi --body-file /tmp/esk.md
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Sudah normal kembali — ditutup otomatis."
          fi
      - name: 10 · Rantai putaran — jadwal cron GitHub sering telat (3 jam); jalankan diri sendiri sampai batas (3 Nov 2026 00.00 UTC; diperpanjang Claude 2 atas izin pemilik)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date -u +%Y%m%d%H%M)
          if [ "$NOW" -lt 202611030000 ]; then
            sleep 420
            gh workflow run orkestrator.yml || true
          fi
