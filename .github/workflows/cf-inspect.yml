name: cf-inspect
on: workflow_dispatch
permissions: { contents: write }
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Periksa Cloudflare (read-only, tanpa mencetak rahasia)
        run: |
          exec > >(tee data/cf-inspect.txt) 2>&1
          api(){ curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/$1"; }
          echo "== settings keys"; api accounts/$A/workers/scripts/maxigrowth/settings | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('result') or {};print(list(r.keys()));print(json.dumps(r.get('assets'))[:600]);print(json.dumps(r.get('bindings'))[:300])"
          echo "== script content (awal)"; api accounts/$A/workers/scripts/maxigrowth/content/v2 | head -c 2500; echo
          echo "== versions"; api accounts/$A/workers/scripts/maxigrowth/versions | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('success'),json.dumps(d.get('result'))[:900],d.get('errors'))"
          echo "== script (alt)"; api accounts/$A/workers/scripts/maxigrowth | head -c 1500; echo
          echo "== homepage"; curl -s https://maxigrowthstudio.com/ | head -c 700; echo; curl -s https://maxigrowthstudio.com/ | grep -oE '(src|href)="[^"]+"' | sort -u | head -40
          echo "== 404 test"; curl -s -o /dev/null -w "%{http_code}\n" https://maxigrowthstudio.com/zzz-tidak-ada/
          echo "== atabara refs"; curl -s https://maxigrowthstudio.com/atabara/ | grep -oE '(src|href)="[^"]+"' | sort -u | head -20
          echo "== token perms probe (routes write dry-run tidak dijalankan)"
      - name: Simpan hasil
        run: |
          git config user.name "maxigrowth-bot"; git config user.email "bot@maxigrowthstudio.com"
          git add data/cf-inspect.txt && git commit -qm "cf-inspect: hasil" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 4; done
