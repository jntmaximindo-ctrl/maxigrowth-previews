# PDF pitch deck per klinik (6 halaman 16:9). Disetujui pemilik 27 Okt 2026 (uji 10 klinik dulu).
# Tanpa AI; TIDAK menghubungi klinik. Hasil diunggah ke Drive bus "12 Pitch Deck PDF".
name: pitch
on:
  workflow_dispatch:
    inputs:
      batas: { description: "Maks klinik per run", default: "10" }
      slug: { description: "Slug tertentu, pisah koma (opsional)", default: "" }
concurrency: { group: pitch, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  pitch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pasang Playwright, Pillow, segno
        run: |
          pip install -q playwright pillow segno
          python -m playwright install --with-deps chromium >/dev/null
      - name: Buat PDF
        run: |
          ARGS="--batas ${{ github.event.inputs.batas || '10' }}"
          if [ -n "${{ github.event.inputs.slug }}" ]; then ARGS="$ARGS --slug ${{ github.event.inputs.slug }}"; fi
          python -u scripts/pitch.py $ARGS | tee /tmp/pitch.log
      - name: Unggah ke Drive "12 Pitch Deck PDF"
        if: always()
        env: { RCLONE_DRIVE_TOKEN: "${{ secrets.RCLONE_DRIVE_TOKEN }}", RCLONE_CLIENT_ID: "${{ secrets.RCLONE_CLIENT_ID }}", RCLONE_CLIENT_SECRET: "${{ secrets.RCLONE_CLIENT_SECRET }}" }
        run: |
          ls /tmp/pitch/*.pdf >/dev/null 2>&1 || { echo "tidak ada PDF baru"; exit 0; }
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          python3 scripts/bus.py rclone-conf
          rclone copy /tmp/pitch "bus:12 Pitch Deck PDF" --include "*.pdf" -v
          [ -d /tmp/pitch_bahan ] && rclone copy /tmp/pitch_bahan "bus:12 Pitch Deck PDF/_bahan" -v || true
      - name: Catat selesai
        if: always()
        run: |
          git config user.name "maxigrowth-bot"; git config user.email "bot@maxigrowthstudio.com"
          git add data/pitch.json || true
          git diff --cached --quiet && exit 0
          git commit -m "pitch: $(grep -c '^✓' /tmp/pitch.log || echo 0) klinik"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
