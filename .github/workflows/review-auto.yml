name: review-auto
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: review-auto
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Review otomatis preview
        run: python3 scripts/review_auto.py
      - name: Simpan hasil
        run: |
          git config user.name review-bot
          git config user.email review-bot@users.noreply.github.com
          git add data/review.json data/review-catatan.json
          git diff --cached --quiet && exit 0
          git commit -m "review-auto: hasil review otomatis"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
