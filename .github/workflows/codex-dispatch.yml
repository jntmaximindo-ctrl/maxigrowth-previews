# Serahkan satu tugas ke Codex (kuota ChatGPT Plus, akun dipilih Codex pool) lewat komentar @codex di PR.
#   tugas=riset    → GPT-A (akun GitHub utama, secret CODEX_PAT_A)  : riset.json + konten.json
#   tugas=cekfakta → GPT-B (akun GitHub kedua, secret CODEX_PAT_B)  : cekfakta.json (pemeriksa independen)
# Dipanggil otomatis oleh research.yml / codex-check.yml, atau manual dari tab Actions.
name: codex-dispatch
on:
  workflow_dispatch:
    inputs:
      job:   { description: "Path job, mis. B04/W14", required: true }
      tugas: { description: "riset / cekfakta / rakit / revisi", required: true, default: "riset" }
      issue: { description: "Nomor issue klinik (opsional)", required: false }
      info: { description: "Untuk tugas cari: 'Kota|Negara'", required: false }
permissions: { contents: write, pull-requests: write, issues: write }
concurrency: { group: "codex-${{ github.event.inputs.job }}-${{ github.event.inputs.tugas }}" }
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan surat tugas + PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ github.event.inputs.job }}
          TUGAS: ${{ github.event.inputs.tugas }}
          ISSUE: ${{ github.event.inputs.issue }}
          INFO: ${{ github.event.inputs.info }}
        run: |
          case "$TUGAS" in riset|cekfakta|rakit|revisi|cari) ;; *) echo "tugas tidak dikenal: $TUGAS"; exit 1;; esac
          SLUG=$(echo "$JOB" | tr '/' '-')
          BR="codex/$TUGAS-$SLUG"
          # PENGAMAN (berlaku untuk semua pemanggil): jangan timpa PR yang masih terbuka,
          # dan berhenti bila tugas yang sama sudah gagal 2x (PR tertutup tanpa merge sejak 30 Sep 2026).
          if gh pr list --state open --head "$BR" --json number -q '.[0].number' | grep -q .; then
            echo "PR $BR masih terbuka — tidak dikirim ulang."; exit 0; fi
          GAGAL=$(gh pr list --state closed --head "$BR" --limit 30 --json mergedAt,createdAt \
            -q '[.[] | select(.mergedAt == null and .createdAt > "2026-09-30T00:00:00Z")] | length')
          if [ "${GAGAL:-0}" -ge 2 ]; then
            echo "STOP $BR: sudah $GAGAL kali gagal. Perlu dicek manual."; exit 0; fi
          # CODEX POOL: pilih akun ChatGPT yang kuotanya masih ada (cek fakta menghindari slot A = beda pemeriksa)
          SLOT=$(python3 scripts/codex_pool.py pilih $([ "$TUGAS" = "cekfakta" ] && echo A))
          [ -n "$SLOT" ] || { echo "Semua slot Codex sedang habis kuota — tugas ditunda, akan dicoba lagi otomatis."; exit 0; }
          echo "slot=${SLOT%% *}" >> $GITHUB_OUTPUT
          echo "secret=${SLOT#* }" >> $GITHUB_OUTPUT
          mkdir -p .codex/tugas
          if [ "$TUGAS" = "cari" ]; then
            KOTA="${INFO%%|*}"; NEGARA="${INFO#*|}"; NAMA="$KOTA"
            sed -e "s#{{JOB}}#$JOB#g" -e "s#{{KOTA}}#$KOTA#g" -e "s#{{NEGARA}}#$NEGARA#g" prompts/codex-cari.md > ".codex/tugas/$SLUG-$TUGAS.md"
          else
            [ -f "batches/$JOB/job.json" ] || { echo "job tidak ada: batches/$JOB"; exit 1; }
            NAMA=$(python -c "import json;print(json.load(open('batches/$JOB/job.json')).get('nama',''))")
            sed -e "s#{{JOB}}#$JOB#g" -e "s#{{DIR}}#batches/$JOB#g" "prompts/codex-$TUGAS.md" > ".codex/tugas/$SLUG-$TUGAS.md"
          fi
          git config user.name "maxigrowth-bot"; git config user.email "bot@maxigrowthstudio.com"
          git push origin --delete "$BR" 2>/dev/null || true
          git checkout -b "$BR"
          git add .codex && git commit --allow-empty -m "tugas codex: $TUGAS $JOB"
          git push -u origin "$BR"
          URL=$(gh pr create --draft --base main --head "$BR" \
            --title "[$JOB] $TUGAS · $NAMA" \
            --body "Tugas otomatis untuk Codex. Instruksi lengkap: \`.codex/tugas/$SLUG-$TUGAS.md\`. Issue klinik: #${ISSUE:-?}")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
      - name: Panggil Codex (@codex)
        if: steps.pr.outputs.url != ''
        env:
          # akun dipilih Codex pool (data/codex-pool.json); fallback ke slot A
          GH_TOKEN: ${{ secrets[steps.pr.outputs.secret] || secrets.CODEX_PAT_A }}
          JOB: ${{ github.event.inputs.job }}
          TUGAS: ${{ github.event.inputs.tugas }}
        run: |
          gh pr comment "${{ steps.pr.outputs.url }}" --body "<!-- slot=${{ steps.pr.outputs.slot }} t=$(date -u +%Y-%m-%dT%H:%M:%SZ) -->
          @codex Kerjakan tugas di file \`.codex/tugas/${{ steps.pr.outputs.slug }}-$TUGAS.md\` untuk job \`batches/$JOB\`. Ikuti AGENTS.md. Push hasilnya ke branch PR ini (jangan buat PR baru bila bisa)."
